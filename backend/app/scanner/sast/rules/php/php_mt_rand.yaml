rule_id: php_mt_rand
language: php
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-330
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Insecure Randomness via mt_rand() or rand()
message: |-
  The mt_rand() and rand() functions generate predictable numbers. They must not be used for passwords, tokens, CSRF nonces, or any security purpose.
sources: []
sinks:
- mt_rand(
- rand(
sanitizers:
- random_bytes(
- random_int(
remediation: |-
  Use random_int() or random_bytes() for cryptographically secure random numbers.

  SAFE:
    $token = bin2hex(random_bytes(32)); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
