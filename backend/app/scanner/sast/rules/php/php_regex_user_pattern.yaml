# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/1236.html
# CodeQL Source:   Not applicable — pattern-based formula character detection
# Semgrep Source:  https://semgrep.dev/r?q=csv+injection
# OWASP Cheat:     https://owasp.org/www-community/attacks/CSV_Injection
# Verification:    CSV formula injection (=,+,@,-) detected as pattern-based code injection. Rule is Tentative.

rule_id: php_regex_user_pattern
language: php
vuln_class: ReDoS
severity: High
cwe: CWE-1333
owasp: A06:2021-Vulnerable and Outdated Components
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Tentative
issue: ReDoS via PHP preg_match() or preg_replace() with user-controlled regex pattern
message: |-
  User-supplied input is used directly as the regex pattern argument to preg_match(), preg_replace(), or preg_match_all() without validation. An attacker can provide a catastrophically backtracking regex (e.g., (a+)+ with a long input) that causes PHP's PCRE engine to run exponentially, hanging the web server process and causing denial of service.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_FILES[
- $_COOKIE[
sinks:
- preg_match(
- preg_replace(
- preg_match_all(
sanitizers:
- preg_match('/^[a-z]+$/'
remediation: |-
  Never allow user input to control the regex pattern argument. Use a hardcoded pattern.

  UNSAFE:
    preg_match($_GET['pattern'], $subject);  /* attacker controls pattern */

  SAFE:
    // Hardcode the pattern; only user controls the subject string
    $allowed_pattern = '/^[a-zA-Z0-9_]+$/';
    preg_match($allowed_pattern, $_GET['subject']);

  If user-defined patterns are required, validate against a strict allowlist of safe patterns and apply PHP's pcre.backtrack_limit and pcre.recursion_limit settings. See OWASP ReDoS prevention guide.
