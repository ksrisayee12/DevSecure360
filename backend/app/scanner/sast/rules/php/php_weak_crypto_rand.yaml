rule_id: php_weak_crypto_rand
language: php
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Weak randomness via PHP rand() or mt_rand() used for security-sensitive token
  generation
message: |-
  PHP rand() and mt_rand() are seeded with a predictable value and produce outputs that can be predicted by an attacker who observes a few output samples via timing analysis. Using these functions to generate session tokens, password reset tokens, CSRF nonces, or encryption keys allows an attacker to forge tokens and hijack sessions or reset arbitrary account passwords.
sources: []
sinks:
- rand(
- mt_rand(
- array_rand(
sanitizers:
- random_bytes(
- random_int(
remediation: |-
  Use random_bytes() or random_int() for all cryptographically secure random number generation.

  UNSAFE:
    $token = md5(rand() . time());
    $otp = mt_rand(100000, 999999);

  SAFE:
    $token = bin2hex(random_bytes(32));
    $otp = random_int(100000, 999999);

  rand() and mt_rand() are NOT cryptographically secure. See OWASP Cryptographic Storage Cheat Sheet.
