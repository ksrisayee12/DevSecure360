# Verification:    DES, 3DES, and RC4 are cryptographically broken algorithms.

rule_id: php_weak_crypto_des
language: php
vuln_class: Weak Crypto
severity: High
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: 'Weak Cryptography: Usage of DES or RC4 in OpenSSL'
message: |-
  Using 'des', 'des-ede3', or 'rc4' cipher methods with openssl_encrypt() relies on obsolete, insecure cryptography that is vulnerable to modern attacks.
sources: []
sinks:
- openssl_encrypt($data, 'des'
- openssl_encrypt($data, 'rc4'
sanitizers:
- openssl_encrypt($data, 'aes-256-gcm'
remediation: |-
  Migrate to strong authenticated encryption such as 'aes-256-gcm' and ensure proper initialization vectors are used. Always ensure input validation and consult language-specific security documentation.
