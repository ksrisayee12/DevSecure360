rule_id: php_ssrf_fopen
language: php
vuln_class: SSRF
severity: High
cwe: CWE-918
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: SSRF via fopen() with allow_url_fopen enabled
message: |-
  When allow_url_fopen is enabled, passing unvalidated user input to fopen() allows an attacker to make outbound HTTP/FTP requests, enabling SSRF.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
sinks:
- fopen(
sanitizers:
- filter_var(
- FILTER_VALIDATE_URL
remediation: |-
  Validate the URL using `filter_var()` and restrict the hostname to a specific allowlist. Ensure it does not resolve to private subnets. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
