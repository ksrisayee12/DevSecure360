rule_id: php_cmdi_popen
language: php
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via PHP popen() with user-controlled command argument
message: |-
  User-supplied data is incorporated into the command string passed to PHP popen(), which opens a process pipe for a shell command. An attacker can inject additional shell commands via metacharacters, executing arbitrary OS commands with the web server user privileges. The opened pipe provides bidirectional communication with the spawned process.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_SERVER[
- $_FILES[
- getallheaders(
sinks:
- popen(
sanitizers:
- escapeshellarg(
- escapeshellcmd(
remediation: |-
  Escape all user input with escapeshellarg() before using in popen() calls, or avoid popen() entirely.

  UNSAFE:
    $handle = popen("convert " . $_POST["file"] . " out.png", "r");

  SAFE:
    $file = escapeshellarg($_POST["file"]);
    $handle = popen("convert " . $file . " out.png", "r");

  Prefer PHP extension functions (Imagick class) over shell execution to eliminate injection risks. See OWASP OS Command Injection Defense Cheat Sheet.
