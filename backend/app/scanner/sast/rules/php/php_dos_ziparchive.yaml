rule_id: php_dos_ziparchive
language: php
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via ZipArchive::extractTo()
message: |-
  Extracting a user-uploaded zip file blindly using ZipArchive::extractTo() enables Zip Bomb attacks that can fill the disk and cause DoS.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
sinks:
- extractTo(
sanitizers:
- statIndex(
remediation: |-
  Iterate over the files using `statIndex()` to check the `size` property. Prevent extraction if the uncompressed size exceeds an allowed limit. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
