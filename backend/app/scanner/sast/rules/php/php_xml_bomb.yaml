rule_id: php_xml_bomb
language: php
vuln_class: DoS
severity: High
cwe: CWE-776
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Tentative
issue: XML Entity Expansion / Billion Laughs (CWE-776)
message: |-
  The application enables external entity loading in XML parsing, making it vulnerable to XML Bomb (Billion Laughs) denial of service attacks.
sources: []
sinks:
- libxml_disable_entity_loader(false)
sanitizers: []
remediation: |-
  Do not explicitly enable entity loading unless absolutely necessary. In modern PHP versions, it is disabled by default to prevent XXE and XML Bombs.

  UNSAFE:
    libxml_disable_entity_loader(false);

  SAFE:
    // Leave the default secure behavior
