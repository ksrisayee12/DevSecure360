rule_id: php_weak_crypto_md5
language: php
vuln_class: Weak Crypto
severity: High
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: 'Weak Cryptography: Usage of md5() or sha1()'
message: |-
  The md5() and sha1() functions are cryptographically broken. They must not be used for passwords or sensitive data integrity verification due to collision risks.
sources: []
sinks:
- md5(
- sha1(
sanitizers:
- hash("sha256"
remediation: |-
  Use hash('sha256', $data) for general hashing, and password_hash() with PASSWORD_DEFAULT or PASSWORD_ARGON2ID for passwords. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
