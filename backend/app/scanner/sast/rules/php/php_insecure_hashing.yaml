# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/328.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/php/semmle/php/security/crypto/WeakHashing.qll
# Semgrep Source:  https://semgrep.dev/r/php.lang.security.weak-crypto.weak-hash
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    md5() and sha1() are cryptographically broken and should never be used for sensitive data.

rule_id: php_insecure_hashing
language: php
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Insecure Hashing Algorithm (CWE-328)
message: |-
  The application uses a broken or weak cryptographic hashing algorithm such as MD5 or SHA1. These algorithms are vulnerable to collision attacks.
sources: []
sinks:
- md5(
- sha1(
sanitizers: []
remediation: |-
  Use strong hashing algorithms like bcrypt, Argon2, or SHA-256 for passwords.

  UNSAFE:
    $hash = md5($_POST['password']);

  SAFE:
    $hash = password_hash($_POST['password'], PASSWORD_DEFAULT);
