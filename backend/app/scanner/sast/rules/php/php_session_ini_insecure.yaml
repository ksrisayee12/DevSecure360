rule_id: php_session_ini_insecure
language: php
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-16
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: PHP session cookie missing HttpOnly or Secure flags in session configuration
message: |-
  The PHP application configures sessions without enabling the cookie_httponly or cookie_secure flags. A session cookie without HttpOnly is accessible to client-side JavaScript, enabling theft via any XSS vulnerability. A cookie without the Secure flag may be sent over unencrypted HTTP connections and intercepted by network attackers.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Configure PHP session cookies with HttpOnly, Secure, and SameSite attributes before calling session_start().

  UNSAFE:
    ini_set("session.cookie_httponly", 0);
    session_start();

  SAFE:
    ini_set("session.cookie_httponly", 1);
    ini_set("session.cookie_secure", 1);
    ini_set("session.cookie_samesite", "Strict");
    session_start();

  See OWASP Session Management Cheat Sheet for comprehensive PHP session security guidance.
