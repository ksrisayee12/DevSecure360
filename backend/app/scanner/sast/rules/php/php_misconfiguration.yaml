rule_id: php_misconfiguration
language: php
vuln_class: Misconfiguration
severity: Low
cwe: CWE-16
owasp: A05:2021-Security Misconfiguration
cvss_score: 4.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Generic Security Misconfiguration
message: |-
  The application exposes server details via the X-Powered-By header or other similar mechanisms that leak backend technology details to attackers.
sources: []
sinks:
- 'header(''X-Powered-By: PHP'')'
sanitizers: []
remediation: |-
  Disable expose_php in php.ini instead of manually sending X-Powered-By headers. This prevents attackers from easily identifying the specific technology stack in use.
