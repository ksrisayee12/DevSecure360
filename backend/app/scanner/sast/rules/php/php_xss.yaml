# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/79.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=xss
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
# Verification:    XSS sinks verified from CodeQL standard libraries and OWASP XSS Prevention Cheat Sheet.

rule_id: php_xss
language: php
vuln_class: XSS
severity: High
cwe: CWE-79
owasp: A03:2021-Injection
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Cross-Site Scripting (XSS) via unescaped output
message: |-
  User input is directly echoed back to the browser without escaping. Attackers can inject malicious scripts that execute in the victim's browser context.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- 'echo '
- 'print '
- printf(
- vprintf(
- die(
- exit(
sanitizers:
- htmlspecialchars(
- htmlentities(
- strip_tags(
remediation: |-
  Always escape user input using htmlspecialchars() before rendering it in HTML.

  UNSAFE:
    echo "<h1>Welcome, " . $_GET['name'] . "</h1>";

  SAFE:
    echo "<h1>Welcome, " . htmlspecialchars($_GET['name'], ENT_QUOTES, 'UTF-8') . "</h1>";
