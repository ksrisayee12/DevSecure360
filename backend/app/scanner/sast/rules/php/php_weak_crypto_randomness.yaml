# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/338.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/php/semmle/php/security/WeakPRNG.qll
# Semgrep Source:  https://semgrep.dev/r/php.lang.security.weak-crypto.weak-prng
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    rand() and mt_rand() are documented by PHP as not cryptographically secure.

rule_id: php_weak_crypto_randomness
language: php
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via rand() or mt_rand()
message: |-
  The application uses a cryptographically weak pseudo-random number generator (PRNG) like rand() or mt_rand(). If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- rand(
- mt_rand(
- uniqid(
- lcg_value(
sanitizers: []
remediation: |-
  Use random_int() or random_bytes() for generating cryptographically strong random numbers.

  UNSAFE:
    $token = mt_rand();

  SAFE:
    $token = random_int(0, 999999);
