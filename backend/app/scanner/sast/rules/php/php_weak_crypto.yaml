remediation: |-
  Use modern algorithms like SHA-256 for hashing, password_hash() for passwords, and random_bytes() for secure random numbers.

  UNSAFE:
    $hash = md5($password);

  SAFE:
    $hash = password_hash($password, PASSWORD_DEFAULT);
