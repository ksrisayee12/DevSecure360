# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/78.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=command+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
# Verification:    OS command execution with shell=True or direct string passing allows RCE.

rule_id: php_shell_exec
language: php
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via shell_exec(), exec(), system(), or backticks with user
  input
message: |-
  Passing user-controlled input to shell execution functions allows arbitrary OS command injection.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
sinks:
- shell_exec(
- exec(
- system(
- passthru(
sanitizers:
- escapeshellarg(
remediation: |-
  Always use escapeshellarg() on user input before embedding it in a shell command.

  UNSAFE:
    exec("ping -c 4 " . $_GET['ip']);

  SAFE:
    exec("ping -c 4 " . escapeshellarg($_GET['ip'])); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
