rule_id: php_path_traversal_unlink
language: php
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H
confidence: Confirmed
issue: Arbitrary File Deletion via unlink()
message: |-
  Concatenating user input into a file path passed to unlink() allows a directory traversal attack that can be used to delete arbitrary sensitive files on the server.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
sinks:
- unlink(
sanitizers:
- basename(
remediation: |-
  Strip directory traversal components using basename() and validate that the target file is within the intended directory. Always ensure input validation and consult language-specific security documentation.
