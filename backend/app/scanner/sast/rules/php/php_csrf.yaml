# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/352.html
# CodeQL Source:   Not applicable — absence-based structural detection
# Semgrep Source:  https://semgrep.dev/r?q=csrf
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
# Verification:    CSRF detection checks for absence of CSRF middleware. Structural/absence-based. Rule is Tentative.

rule_id: php_csrf
language: php
vuln_class: CSRF
severity: High
cwe: CWE-352
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Cross-Site Request Forgery (CSRF) Protection Missing
message: |-
  A form or state-changing action is performed without verifying a CSRF token. This allows attackers to trick authenticated users into executing unwanted actions on the application.
sources: []
sinks:
- <form
sanitizers:
- wp_nonce_field
- '@csrf'
- csrf_token()
remediation: |-
  Ensure all forms include a CSRF token (e.g., @csrf in Laravel or wp_nonce_field in WordPress).

  UNSAFE:
    <form action="/update" method="POST">

  SAFE:
    <form action="/update" method="POST"> @csrf
