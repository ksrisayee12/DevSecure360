rule_id: php_dos_libxml_noent
language: php
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via LIBXML_NOENT in simplexml
message: |-
  Passing the LIBXML_NOENT flag to simplexml_load_string() enables entity substitution. An attacker can provide nested entities (Billion Laughs) to crash the PHP process.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
sinks:
- simplexml_load_string(
- LIBXML_NOENT
sanitizers:
- remove LIBXML_NOENT
remediation: |-
  Do not use the `LIBXML_NOENT` option when parsing untrusted XML, as it enables dangerous entity expansion. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
