sanitizers:
- true, true)
remediation: |-
  Ensure all `setcookie()` and `setrawcookie()` calls explicitly set both `secure` and `httponly` flags to `true`. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
