# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/643.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/php/semmle/php/security/dataflow/XPathInjection.qll
# Semgrep Source:  https://semgrep.dev/r/php.lang.security.xpath-injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
# Verification:    Concatenating user input into DOMXPath->query() is the primary vector for PHP XPath Injection.

rule_id: php_xpath_injection
language: php
vuln_class: XPath Injection
severity: High
cwe: CWE-643
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: XPath Injection
message: |-
  User input is used to construct an XPath query without sanitization. Attackers can modify the query logic to bypass authentication or extract unauthorized data from the XML document.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- DOMXPath->query(
- DOMXPath->evaluate(
- SimpleXMLElement->xpath(
sanitizers: []
remediation: |-
  Sanitize user input before using it in XPath queries, or use parameterized XPath queries if supported by the library.

  UNSAFE:
    $xpath->query("//user[username/text()='" . $_GET['user'] . "']");

  SAFE:
    // Validate input or use safer XML querying patterns.
