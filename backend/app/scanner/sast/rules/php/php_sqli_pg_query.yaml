rule_id: php_sqli_pg_query
language: php
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via PHP pg_query() with concatenated user input for PostgreSQL
message: |-
  User-supplied data from HTTP parameters is concatenated into a PostgreSQL query string passed to pg_query(). pg_query() does not support parameterization — an attacker can inject SQL to dump all database tables, modify records, call arbitrary PostgreSQL functions, or escalate privileges. PostgreSQL supports COPY TO FILE which can exfiltrate server-side files.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_SERVER[
- $_FILES[
- getallheaders(
sinks:
- pg_query(
- pg_exec(
sanitizers:
- pg_query_params(
- pg_prepare(
- pg_execute(
remediation: |-
  Use pg_query_params() with positional $1 parameters instead of pg_query() with concatenation.

  UNSAFE:
    pg_query($conn, "SELECT * FROM users WHERE name = '" . $_GET["name"] . "'");

  SAFE:
    pg_query_params($conn, "SELECT * FROM users WHERE name = $1", array($_GET["name"]));

  Or use PDO with prepare()/execute(). See OWASP SQL Injection Prevention Cheat Sheet.
