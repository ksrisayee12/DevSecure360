# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/117.html
# CodeQL Source:   Not applicable — pattern-based log sink detection
# Semgrep Source:  https://semgrep.dev/r?q=log+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
# Verification:    Log injection sinks verified from Semgrep registry and official logging library documentation.

rule_id: php_log_injection
language: php
vuln_class: Log Injection
severity: Medium
cwe: CWE-117
owasp: A09:2021-Security Logging and Monitoring Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection via error_log
message: |-
  User input is written directly to logs without sanitization, allowing attackers to forge log entries or inject CRLF characters.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- error_log(
- Log::info(
- Log::error(
sanitizers: []
remediation: |-
  Sanitize input by removing newline characters before logging, or use structured logging.

  UNSAFE:
    error_log('Failed login for ' . $_POST['user']);

  SAFE:
    error_log('Failed login for ' . str_replace(array("\r", "\n"), '', $_POST['user']));
