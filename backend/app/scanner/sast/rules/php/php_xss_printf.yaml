rule_id: php_xss_printf
language: php
vuln_class: XSS
severity: High
cwe: CWE-79
owasp: A03:2021-Injection
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Cross-Site Scripting via PHP printf() with unencoded user-supplied string argument
message: |-
  User-controlled input is passed as an argument to printf() or fprintf() which outputs HTML directly to the response. An attacker can inject HTML tags, JavaScript event handlers, or script elements into the rendered page, executing malicious scripts in the victim's browser to steal session cookies, redirect users, or perform unauthorized account actions.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_SERVER[
- $_FILES[
- getallheaders(
sinks:
- printf(
- fprintf(
sanitizers:
- htmlspecialchars(
- htmlentities(
remediation: |-
  HTML-encode user input before passing to printf() using htmlspecialchars() with ENT_QUOTES.

  UNSAFE:
    printf("<p>Hello %s</p>", $_GET["name"]);

  SAFE:
    printf("<p>Hello %s</p>", htmlspecialchars($_GET["name"], ENT_QUOTES, "UTF-8"));

  Use a templating engine with auto-escaping (Twig, Blade) instead of printf() for HTML output. See OWASP XSS Prevention Cheat Sheet.
