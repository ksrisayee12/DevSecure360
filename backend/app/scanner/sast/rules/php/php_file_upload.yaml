rule_id: php_file_upload
language: php
vuln_class: File Upload
severity: Critical
cwe: CWE-434
owasp: A04:2021-Insecure Design
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Unrestricted File Upload via move_uploaded_file
message: |-
  User-uploaded files are saved without validating their type, extension, or content. Attackers can upload malicious PHP scripts (e.g., shell.php) and execute them on the server, leading to Remote Code Execution.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- move_uploaded_file(
- copy(
- file_put_contents(
sanitizers: []
remediation: |-
  Strictly validate uploaded files. Enforce a strong allowlist for file extensions, verify the MIME type using finfo, limit file size, and store uploaded files outside the web root or without execution permissions.

  UNSAFE:
    move_uploaded_file($_FILES['userfile']['tmp_name'], $upload_dir . $_FILES['userfile']['name']);

  SAFE:
    // Validate extension, MIME type, and use a randomly generated safe filename.
