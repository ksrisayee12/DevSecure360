rule_id: php_missing_csp
language: php
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Content-Security-Policy header in PHP HTTP response
message: |-
  The PHP application does not emit a Content-Security-Policy response header. Without CSP, any reflected or stored XSS vulnerability has no browser-level defense. A successful XSS attack can steal authenticated session cookies via document.cookie, exfiltrate form inputs, or make authenticated requests to the server on behalf of the victim user.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set a Content-Security-Policy header in all PHP responses from a central location.

  UNSAFE: No Content-Security-Policy header emitted.
  SAFE:
    header("Content-Security-Policy: default-src 'self'; script-src 'self'");

  Apply in a global bootstrap file before any output. Test your policy with a CSP evaluator tool before deployment.
