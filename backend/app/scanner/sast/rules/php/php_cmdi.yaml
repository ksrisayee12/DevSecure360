# Verification:    Command injection sinks verified from CodeQL standard libraries and Semgrep registry.

rule_id: php_cmdi
language: php
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via exec/system
message: |-
  User input is passed directly to operating system command execution functions. Attackers can append shell commands to gain Remote Code Execution (RCE) on the server.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
- $_SERVER[
- $HTTP_GET_VARS[
- $HTTP_POST_VARS[
- $HTTP_COOKIE_VARS[
- $HTTP_RAW_POST_DATA
- file_get_contents('php://input')
sinks:
- exec(
- system(
- shell_exec(
- passthru(
- popen(
- proc_open(
- pcntl_exec(
- '` (backticks)'
sanitizers:
- escapeshellarg(
- escapeshellcmd(
remediation: |-
  Avoid using OS command execution functions if possible. If required, strictly sanitize user input using escapeshellarg().

  UNSAFE:
    system("ping -c 1 " . $_POST['ip']);

  SAFE:
    system("ping -c 1 " . escapeshellarg($_POST['ip']));
