rule_id: php_xpath_injection_domxpath
language: php
vuln_class: XPath Injection
severity: High
cwe: CWE-643
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: XPath Injection via DOMXPath::query()
message: |-
  Dynamic concatenation of user input into an XPath query string enables XPath injection, allowing attackers to alter the logic of the XML search.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
sinks:
- $xpath->query(
sanitizers:
- addslashes(
remediation: |-
  Validate user input against an allowlist before using it in an XPath query to prevent injection. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
