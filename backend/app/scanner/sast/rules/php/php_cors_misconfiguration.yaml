rule_id: php_cors_misconfiguration
language: php
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.4
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Permissive Cross-Origin Resource Sharing (CORS)
message: |-
  The application configures CORS to allow requests from any origin ('*'), which can expose sensitive data to malicious sites if credentials are included.
sources: []
sinks:
- 'header("Access-Control-Allow-Origin: *")'
- 'header(''Access-Control-Allow-Origin: *'')'
sanitizers: []
remediation: |-
  Configure CORS to only allow trusted domains.

  UNSAFE:
    header('Access-Control-Allow-Origin: *');

  SAFE:
    header('Access-Control-Allow-Origin: https://trusted.example.com');
