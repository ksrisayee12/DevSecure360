# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/209.html
# CodeQL Source:   Not applicable — structural error output pattern detection
# Semgrep Source:  https://semgrep.dev/r?q=information+exposure
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
# Verification:    Information exposure detection is structural, checking for verbose error output patterns. Rule is Tentative.

rule_id: php_info_exposure
language: php
vuln_class: Information Exposure
severity: Low
cwe: CWE-209
owasp: A05:2021-Security Misconfiguration
cvss_score: 4.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Information Exposure through Error Messages
message: |-
  The application displays detailed exception stack traces to the user, potentially exposing internal paths and system configurations.
sources: []
sinks:
- echo $e->getMessage()
- print $e->getMessage()
- var_dump($e)
sanitizers: []
remediation: |-
  Log errors internally but show generic messages to users.

  UNSAFE:
    echo $e->getMessage();

  SAFE:
    error_log($e->getMessage()); echo 'An error occurred.';
