# Verification:    Disabling TLS certificate validation allows Man-in-the-Middle (MitM) attacks. Tentative.

rule_id: php_tls_curl_verifyhost
language: php
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: CURLOPT_SSL_VERIFYHOST set to 0'
message: |-
  Setting CURLOPT_SSL_VERIFYHOST to 0 (false) in PHP cURL disables verification that the server certificate matches the requested hostname, enabling MitM attacks.
sources: []
sinks:
- CURLOPT_SSL_VERIFYHOST, 0
- CURLOPT_SSL_VERIFYHOST, false
sanitizers:
- CURLOPT_SSL_VERIFYHOST, 2
remediation: |-
  Ensure CURLOPT_SSL_VERIFYHOST is set to 2 (the secure default) to properly validate the certificate hostname. Always review your code and apply strict validation. Consult secure coding best practices.
