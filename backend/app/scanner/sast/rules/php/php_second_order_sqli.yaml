rule_id: php_second_order_sqli
language: php
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: 'Second-Order SQL Injection: value from mysqli_fetch_assoc() re-used in concatenated
  SQL query'
message: |-
  A value retrieved from the database via mysqli_fetch_assoc(), pg_fetch_assoc(), or PDO fetch is concatenated directly into a subsequent SQL query. An attacker who previously stored a SQL injection payload (e.g., ' OR '1'='1) can trigger second-order execution when the stored value is used in a later query without parameterization.
sources:
- mysqli_fetch_assoc(
- pg_fetch_assoc(
- $row[
- $result[
sinks:
- mysqli_query($conn, "SELECT.*" . $row
- pg_query($conn, "SELECT.*" . $result
- $db->query(".*" . $row
sanitizers:
- mysqli_prepare(
- $pdo->prepare(
- pg_query_params(
remediation: |-
  Always parameterize SQL queries, even when the data comes from your own database.

  UNSAFE:
    $row = mysqli_fetch_assoc($r);
    mysqli_query($conn, "SELECT * FROM logs WHERE user = '" . $row['username'] . "'");

  SAFE:
    $row = mysqli_fetch_assoc($r);
    $stmt = mysqli_prepare($conn, "SELECT * FROM logs WHERE user = ?");
    mysqli_bind_param($stmt, 's', $row['username']);
    mysqli_execute($stmt);

  Treat database-sourced values as untrusted. See OWASP SQL Injection Prevention Cheat Sheet.
