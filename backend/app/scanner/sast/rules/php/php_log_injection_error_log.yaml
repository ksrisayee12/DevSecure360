rule_id: php_log_injection_error_log
language: php
vuln_class: Log Injection
severity: Medium
cwe: CWE-117
owasp: A09:2021-Security Logging and Monitoring Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection via error_log() or file_put_contents()
message: |-
  Writing user-controlled input to logs using error_log() without sanitization allows an attacker to inject newlines and spoof log records.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
sinks:
- error_log(
- file_put_contents(
- fwrite(
sanitizers:
- str_replace(
remediation: |-
  Sanitize the input by replacing carriage returns and newlines with spaces before logging. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
