rule_id: php_insecure_file_upload_move
language: php
vuln_class: File Upload
severity: Critical
cwe: CWE-434
owasp: A04:2021-Insecure Design
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Insecure File Upload via move_uploaded_file() without validation
message: |-
  Moving an uploaded file directly to a web-accessible directory without checking its extension allows an attacker to upload a .php web shell and achieve RCE.
sources:
- $_GET[
- $_POST[
- $_REQUEST[
- $_COOKIE[
- $_FILES[
sinks:
- move_uploaded_file(
sanitizers:
- pathinfo(
- in_array(
remediation: |-
  Check the file extension against a strict allowlist and store uploaded files outside of the web root directory. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
