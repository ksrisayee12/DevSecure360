# Verification:    XML parsers processing untrusted data without disabling DTDs allow XXE attacks.

rule_id: c_xxe_libxml2
language: c
vuln_class: XXE
severity: High
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: XML External Entity (XXE) via libxml2 parsing
message: |-
  Parsing untrusted XML data with libxml2 while external entity resolution (XML_PARSE_NOENT) is enabled permits XXE attacks, resulting in file disclosure or SSRF.
sources: []
sinks:
- xmlReadMemory(
- xmlReadFile(
sanitizers:
- XML_PARSE_NOENT
remediation: |-
  Explicitly disable DTD processing and external entity resolution by not passing the XML_PARSE_NOENT flag when parsing untrusted XML. Always ensure input validation and consult language-specific security documentation.
