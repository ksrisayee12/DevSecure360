rule_id: c_buffer_overflow
language: c
vuln_class: Buffer Overflow
severity: High
cwe: CWE-119
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Buffer Overflow via unsafe string functions
message: |-
  User input is copied into a fixed-size buffer using unsafe functions that do not check bounds. Attackers can overflow the buffer to overwrite memory, potentially gaining Remote Code Execution.
sources:
- gets(
- fgets(
- scanf(
- fscanf(
- sscanf(
- read(
- recv(
- recvfrom(
- getenv(
- argv[
sinks:
- strcpy(
- strcat(
- sprintf(
- vsprintf(
- gets(
sanitizers:
- strncpy(
- strncat(
- snprintf(
- fgets(
remediation: |-
  Use bounds-checking string functions from the C standard library. Never use gets() under any circumstances.

  UNSAFE:
    strcpy(dest, argv[1]);

  SAFE:
    strncpy(dest, argv[1], sizeof(dest) - 1);
    dest[sizeof(dest) - 1] = '\0';
