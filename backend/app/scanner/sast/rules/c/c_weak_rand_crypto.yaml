# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/338.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=weak+random
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    rand()/srand() and std::rand() verified as cryptographically insecure from NIST and CodeQL.

rule_id: c_weak_rand_crypto
language: c
vuln_class: Weak Crypto
severity: High
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Weak randomness via C rand()/srand(time(NULL)) used for security-sensitive
  token or key generation
message: |-
  The application uses rand() seeded with srand(time(NULL)) to generate session tokens, cryptographic nonces, or password reset codes. The C rand() PRNG is not cryptographically secure; its state can be predicted after observing a few outputs. srand(time(NULL)) seeds with a value that has only second-level resolution, making brute-force feasible.
sources: []
sinks:
- rand()
- srand(time(
sanitizers:
- getrandom(
- arc4random_buf(
remediation: |-
  Use OS-provided cryptographic random number generators for all security-sensitive values.

  UNSAFE:
    srand(time(NULL));
    int token = rand();

  SAFE (Linux):
    uint8_t token[32];
    getrandom(token, sizeof(token), 0);

  SAFE (BSD/macOS):
    uint8_t token[32];
    arc4random_buf(token, sizeof(token));

  Never use rand() for cryptographic purposes. See CERT MSC30-C and OWASP Cryptographic Storage Cheat Sheet.
