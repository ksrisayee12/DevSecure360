# Verification:    Using wildcard (*) for CORS Access-Control-Allow-Origin exposes APIs to cross-origin attacks. Tentative.

rule_id: c_cors_misconfig_header
language: c
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: 'CORS Misconfiguration: Access-Control-Allow-Origin: *'
message: |-
  Hardcoding the Access-Control-Allow-Origin header to '*' allows any website to make cross-origin requests to the server and read its responses, bypassing the Same-Origin Policy.
sources: []
sinks:
- '"Access-Control-Allow-Origin: *"'
sanitizers:
- allowed_origins
remediation: |-
  Instead of a wildcard, dynamically echo the Origin header if it matches a strict server-side allowlist of permitted domains. Always review your code and apply strict validation. Consult secure coding best practices.
