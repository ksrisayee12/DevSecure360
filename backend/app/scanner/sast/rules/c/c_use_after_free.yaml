rule_id: c_use_after_free
language: c
vuln_class: Use After Free
severity: High
cwe: CWE-416
owasp: A04:2021-Insecure Design
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Use After Free (UAF) Vulnerability
message: |-
  Referencing memory after it has been freed can cause a program to crash or, more severely, allow an attacker to execute arbitrary code by controlling the reallocated memory.
sources: []
sinks:
- free(
sanitizers:
- ptr = NULL
remediation: |-
  Immediately set the pointer to NULL after freeing it (e.g., `free(ptr); ptr = NULL;`). Ensure logic flow cannot access the pointer after deallocation. Always review your code and apply strict validation. Consult secure coding best practices.
