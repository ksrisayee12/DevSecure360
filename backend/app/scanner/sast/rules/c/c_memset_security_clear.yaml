rule_id: c_memset_security_clear
language: c
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-14
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.5
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: Compiler may optimize away memset() used to clear security-critical memory
  before deallocation
message: |-
  memset() called to zero out a buffer containing a password, key, or secret immediately before the buffer goes out of scope may be silently removed by the optimizing compiler. Since the memory is 'dead' (not read after the memset), compilers treat it as a no-op. The secret remains in freed/stack memory and can be recovered via memory dumps or heap spraying.
sources: []
sinks:
- memset(password
- memset(key
- memset(secret
- memset(token
sanitizers:
- explicit_bzero(
- SecureZeroMemory(
- memset_s(
remediation: |-
  Use explicit_bzero(), SecureZeroMemory(), or memset_s() which cannot be optimized away.

  UNSAFE:
    memset(password, 0, sizeof(password));  /* may be optimized away */

  SAFE (POSIX):
    explicit_bzero(password, sizeof(password));  /* not optimizable */

  SAFE (Windows):
    SecureZeroMemory(password, sizeof(password));

  SAFE (C11):
    memset_s(password, sizeof(password), 0, sizeof(password));

  See CERT C MSC06-C and OWASP Cryptographic Storage Cheat Sheet for secure memory clearing.
