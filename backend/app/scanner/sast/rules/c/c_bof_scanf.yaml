rule_id: c_bof_scanf
language: c
vuln_class: Buffer Overflow
severity: Critical
cwe: CWE-120
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Buffer Overflow via scanf without Width Specifier
message: |-
  The application uses scanf() with an unbounded string format specifier (e.g., '%s'), which can overflow the destination buffer.
sources:
- argv
- getenv
- read
- recv
- recvfrom
- fread
- fgets
- scanf
- fscanf
- sscanf
- gets
sinks:
- scanf("%s"
- fscanf(
- sscanf(
sanitizers: []
remediation: |-
  Use width specifiers in scanf (e.g., '%64s') or prefer safe input functions like fgets() for string reading.
