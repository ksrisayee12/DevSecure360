rule_id: c_info_exposure_printf_debug
language: c
vuln_class: Information Exposure
severity: Low
cwe: CWE-209
owasp: A05:2021-Security Misconfiguration
cvss_score: 4.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Information Exposure via Debug Print Statements
message: |-
  Using printf() or fprintf(stderr, ...) to output raw variable dumps, stack states, or verbose internal details can expose sensitive information in production environments.
sources: []
sinks:
- printf(
- fprintf(stderr
sanitizers:
- '#ifdef DEBUG'
remediation: |-
  Ensure debug statements are conditionally compiled out of release builds using `#ifdef NDEBUG` or avoid logging sensitive system information entirely. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
