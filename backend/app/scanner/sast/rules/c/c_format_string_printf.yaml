# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/134.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/cpp/
# Semgrep Source:  https://semgrep.dev/r?q=format+string
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/C-Based_Toolchain_Hardening_Cheat_Sheet.html
# Verification:    Using user input as a format string in printf-like functions allows memory read/write.

rule_id: c_format_string_printf
language: c
vuln_class: Format String
severity: Critical
cwe: CWE-134
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Format String Vulnerability in printf()
message: |-
  Passing user-controlled input directly as the format string argument to printf() enables format string attacks. Attackers can use %x to read memory or %n to write memory, leading to RCE.
sources: []
sinks:
- printf(userInput)
- fprintf(file, userInput)
- sprintf(buf, userInput)
sanitizers:
- '%s'
remediation: |-
  Always use a static format string (e.g., "%s") when printing user-controlled data.

  UNSAFE:
    printf(userInput);

  SAFE:
    printf("%s", userInput); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
