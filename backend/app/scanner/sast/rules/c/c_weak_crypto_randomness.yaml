# Verification:    rand() is explicitly documented in C standard as not cryptographically secure.

rule_id: c_weak_crypto_randomness
language: c
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via rand()
message: |-
  The application uses rand(), which is a cryptographically weak pseudo-random number generator (PRNG). If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- rand(
sanitizers: []
remediation: |-
  Use cryptographically secure APIs provided by your OS (e.g., /dev/urandom or getrandom()) for security-sensitive randomness.

  UNSAFE:
    srand(time(NULL));
    int token = rand();

  SAFE:
    // Use getrandom() or read from /dev/urandom
