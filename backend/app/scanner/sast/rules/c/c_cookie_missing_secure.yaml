# Verification:    Missing Secure or HttpOnly flags on session cookies exposes them to XSS and MitM theft.

rule_id: c_cookie_missing_secure
language: c
vuln_class: Cookie Security
severity: Medium
cwe: CWE-614
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: 'Cookie Security: Missing Secure and HttpOnly flags'
message: |-
  Creating HTTP cookies manually in C web servers (e.g., CGI) without appending the 'Secure' and 'HttpOnly' attributes exposes the cookie to interception over HTTP and XSS attacks.
sources: []
sinks:
- 'Set-Cookie: '
sanitizers:
- Secure; HttpOnly
remediation: |-
  Always append '; Secure; HttpOnly' when emitting Set-Cookie headers to ensure cookies are only transmitted over HTTPS and cannot be accessed via JavaScript. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
