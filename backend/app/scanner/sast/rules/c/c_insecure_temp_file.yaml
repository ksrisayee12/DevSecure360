rule_id: c_insecure_temp_file
language: c
vuln_class: Misconfiguration
severity: High
cwe: CWE-377
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Insecure Temporary File Creation
message: |-
  The application uses tmpnam(), tempnam(), or mktemp() to create temporary files. These functions are vulnerable to race conditions (TOCTOU), allowing attackers to create a symlink with the predicted filename before the application creates the file.
sources: []
sinks:
- tmpnam(
- tempnam(
- mktemp(
sanitizers: []
remediation: |-
  Use mkstemp() instead, which creates and opens the file securely, returning a file descriptor and avoiding race conditions.

  UNSAFE:
    char* name = mktemp(template);
    FILE* f = fopen(name, "w");

  SAFE:
    int fd = mkstemp(template);
    FILE* f = fdopen(fd, "w");
