rule_id: c_log_forging_syslog
language: c
vuln_class: Log Injection
severity: Medium
cwe: CWE-117
owasp: A09:2021-Security Logging and Monitoring Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection (Forging) via syslog()
message: |-
  Logging unvalidated user input directly into syslog allows attackers to inject newline characters (CRLF) and forge fake log entries, undermining audit trails.
sources: []
sinks:
- syslog(
sanitizers:
- str_replace(
- remove_newlines(
remediation: |-
  Sanitize user input before logging by removing or escaping newline characters (\r and \n) to prevent log entry injection. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
