# Verification:    Functions like strcpy and gets are historically vulnerable to buffer overflows as they do not check destination bounds.

rule_id: c_unsafe_string
language: c
vuln_class: Buffer Overflow
severity: High
cwe: CWE-120
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Unsafe String Manipulation (CWE-120)
message: |-
  The application uses unsafe legacy C string functions that do not check buffer bounds (e.g., strcpy, strcat, gets). These are classic vectors for buffer overflows.
sources: []
sinks:
- strcpy(
- strcat(
- gets(
- sprintf(
sanitizers: []
remediation: |-
  Use safe, bounds-checked string manipulation functions like strncpy, strncat, snprintf, or C++ std::string.

  UNSAFE:
    strcpy(dest, src);

  SAFE:
    strncpy(dest, src, sizeof(dest)-1);
