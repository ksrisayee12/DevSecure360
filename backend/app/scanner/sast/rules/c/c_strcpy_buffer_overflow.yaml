rule_id: c_strcpy_buffer_overflow
language: c
vuln_class: Buffer Overflow
severity: Critical
cwe: CWE-120
owasp: A06:2021-Vulnerable and Outdated Components
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Buffer Overflow via strcpy() copying unbounded string into fixed-size buffer
message: |-
  The strcpy() function does not check buffer lengths and copies until a null byte is found. If the source string is larger than the destination buffer, it causes a buffer overflow, overwriting adjacent stack or heap memory. This can lead to arbitrary code execution.
sources: []
sinks:
- strcpy(
sanitizers:
- strncpy(
- strlcpy(
remediation: |-
  Use bounded string copy functions like strncpy() or strlcpy().

  UNSAFE:
    strcpy(dest, src);

  SAFE:
    strncpy(dest, src, sizeof(dest) - 1);
    dest[sizeof(dest) - 1] = '\0'; Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
