# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/798.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=hardcoded+secret
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
# Verification:    Hardcoded credentials/tokens in source verified from CodeQL and Semgrep secret detection registries.

rule_id: c_hardcoded_secret
language: c
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded credential or API key literal found in C source code
message: |-
  A plaintext password, API key, or secret token is hardcoded as a string literal in C source. Anyone with access to the binary, compiled object, or source repository can extract the credential. Hardcoded secrets cannot be rotated without recompiling and redeploying, and are routinely leaked via version control history even after removal.
sources: []
sinks:
- password = "
- secret = "
- api_key = "
- token = "
- passwd = "
sanitizers:
- getenv(
- read_config(
remediation: |-
  Load secrets from environment variables or a secrets manager — never embed them in source.

  UNSAFE:
    const char *api_key = "sk_live_aBcDeFgHiJkLmNoPqRsTuVwXyZ";

  SAFE:
    const char *api_key = getenv("API_KEY");
    if (!api_key) { fprintf(stderr, "API_KEY not set"); exit(1); }

  For rotation: use a secrets manager (Vault, AWS Secrets Manager). Scan historical commits with git-secrets or truffleHog. See OWASP Secrets Management Cheat Sheet.
