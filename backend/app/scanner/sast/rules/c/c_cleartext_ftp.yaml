rule_id: c_cleartext_ftp
language: c
vuln_class: Cleartext Transmission
severity: High
cwe: CWE-319
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: Cleartext Transmission via FTP
message: |-
  Initiating connections over the unencrypted FTP protocol (e.g., using ftp:// in libcurl) transmits credentials and data in plaintext, exposing them to network eavesdropping.
sources: []
sinks:
- '"ftp://'
sanitizers:
- '"ftps://'
- '"sftp://'
remediation: |-
  Migrate from FTP to secure alternatives like FTPS (FTP over SSL/TLS) or SFTP (SSH File Transfer Protocol). Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
