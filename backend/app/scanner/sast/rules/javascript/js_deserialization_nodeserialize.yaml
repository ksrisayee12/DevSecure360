- process.argv[
- readline.question(
sinks:
- serialize.unserialize(
- unserialize(
sanitizers: []
remediation: |-
  Never use node-serialize or other insecure deserializers on untrusted data. Use safe, standard data formats like JSON (JSON.parse()) which do not support function execution.

  UNSAFE:
    var obj = serialize.unserialize(req.body.data);

  SAFE:
    var obj = JSON.parse(req.body.data);
