rule_id: js_path_traversal_express
language: javascript
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via Express Response
message: |-
  Untrusted input is used in res.sendFile() or express.static() without setting the 'root' option securely, potentially leaking arbitrary files.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- res.sendFile(
- express.static(
sanitizers: []
remediation: |-
  Always define a secure 'root' property in the options object of res.sendFile() to restrict file access to the specific directory.
