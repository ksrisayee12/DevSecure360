remediation: |-
  Disable external entity resolution in your XML parser configuration. For libxmljs, ensure the noent option is false (which is the default, but verify it isn't set to true).

  UNSAFE:
    libxmljs.parseXmlString(xml, { noent: true })

  SAFE:
    libxmljs.parseXmlString(xml, { noent: false })
