# CWE Source:      https://cwe.mitre.org/data/definitions/287.html
# CodeQL Source:   Not applicable — pattern-based JWT decode detection
# Semgrep Source:  https://semgrep.dev/r?q=jwt
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
# Verification:    JWT bypass sinks verified from Semgrep registry and official JWT library documentation.

rule_id: js_jwt_bypass
language: javascript
vuln_class: JWT Bypass
severity: High
cwe: CWE-287
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: JWT Verification Bypass or None Algorithm
message: |-
  The application decodes JWTs without verifying the signature or allows the 'none' algorithm. Attackers can forge tokens and impersonate any user.
sources: []
sinks:
- jwt.decode(
- jsonwebtoken.decode(
sanitizers:
- jwt.verify(
- jsonwebtoken.verify(
remediation: |-
  Always use jwt.verify() to check the token signature instead of jwt.decode(). Explicitly define the allowed algorithms to prevent 'none' algorithm attacks.

  UNSAFE:
    const payload = jwt.decode(token)

  SAFE:
    const payload = jwt.verify(token, secret, { algorithms: ['HS256'] })
