rule_id: js_sqli_knex
language: javascript
vuln_class: SQLi
severity: High
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 8.5
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection in Knex.js
message: |-
  Raw SQL is executed using Knex.js raw methods with unparameterized user input, allowing attackers to inject malicious SQL logic.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- knex.raw(
- knex.whereRaw(
- knex.havingRaw(
sanitizers: []
remediation: |-
  Use Knex's built-in bindings for raw queries, such as knex.raw('... ?', [value]), to ensure parameters are properly escaped.
