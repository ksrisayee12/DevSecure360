rule_id: js_redos_regex
language: javascript
vuln_class: ReDoS
severity: Medium
cwe: CWE-1333
owasp: A01:2021-Broken Access Control
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
confidence: Tentative
issue: ReDoS via RegExp constructor
message: |-
  Dynamically constructing regular expressions using unvalidated user input (new RegExp(input)) can introduce ReDoS vulnerabilities or alter expected parsing logic.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- new RegExp(
sanitizers:
- re2
remediation: |-
  Avoid building RegExp objects directly from user input. If necessary, escape the input securely or use a robust regex library like node-re2. Always ensure input validation and consult language-specific security documentation.
