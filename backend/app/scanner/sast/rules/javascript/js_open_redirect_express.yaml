# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
# Verification:    Unvalidated user input used in HTTP redirect headers leads to Open Redirect/Phishing.

rule_id: js_open_redirect_express
language: javascript
vuln_class: Open Redirect
severity: Medium
cwe: CWE-601
owasp: A01:2021-Broken Access Control
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Open Redirect via res.redirect() in Express
message: |-
  Using unvalidated input in res.redirect() allows attackers to redirect victims to malicious domains via phishing links.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- res.redirect(
sanitizers:
- URL constructor validate
remediation: |-
  Validate the target URL against an allowlist, or enforce relative paths (e.g., if(url.startsWith('/'))) before redirecting. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
