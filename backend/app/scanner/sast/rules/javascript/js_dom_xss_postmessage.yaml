# CWE Source:      https://cwe.mitre.org/data/definitions/79.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=xss+dom
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
# Verification:    DOM XSS (postMessage, location.href) sinks verified from CodeQL JS DOM standard libraries.

rule_id: js_dom_xss_postmessage
language: javascript
vuln_class: XSS
severity: High
cwe: CWE-79
owasp: A03:2021-Injection
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: DOM XSS via window.postMessage event handler inserting event.data into the
  DOM without validation
message: |-
  The application listens for postMessage events and inserts event.data content into the DOM via innerHTML, document.write(), or eval() without validating the message origin or sanitizing the content. Any window on the same machine can send a postMessage. An attacker controlling a page the victim visits can send a crafted message containing JavaScript.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
- window.location
sinks:
- addEventListener('message'
- window.addEventListener("message"
sanitizers:
- event.origin
- DOMPurify.sanitize(
remediation: |-
  Always validate event.origin against a strict allowlist before processing postMessage data.

  UNSAFE:
    window.addEventListener('message', (event) => {
        document.getElementById('output').innerHTML = event.data;  /* XSS */
    });

  SAFE:
    window.addEventListener('message', (event) => {
        if (event.origin !== 'https://trusted.example.com') return;
        const safe = DOMPurify.sanitize(event.data);
        document.getElementById('output').textContent = safe;
    });

  Use textContent instead of innerHTML where possible. See OWASP postMessage Security guidance.
