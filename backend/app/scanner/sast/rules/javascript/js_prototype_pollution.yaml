sinks:
- Object.assign(
- _.merge(
- _.extend(
- _.defaultsDeep(
- jQuery.extend(
- merge(
- extend(
sanitizers: []
remediation: |-
  Use safe object merging functions that explicitly block the '__proto__' or 'constructor' keys, or create objects without prototypes using Object.create(null).

  UNSAFE:
    _.merge(target, req.body)

  SAFE:
    // Validate input schema or use a secure merge library that drops __proto__
