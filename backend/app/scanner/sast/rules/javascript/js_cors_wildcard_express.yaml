rule_id: js_cors_wildcard_express
language: javascript
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: 'CORS Misconfiguration: wildcard origin in Express'
message: |-
  Configuring the cors() middleware or setting Access-Control-Allow-Origin to '*' allows any site to read responses from the API.
sources: []
sinks:
- 'cors({ origin: ''*'' })'
- res.setHeader('Access-Control-Allow-Origin', '*')
sanitizers:
- 'cors({ origin: ''https://trusted.com'' })'
remediation: |-
  Configure the CORS origin property to explicitly match trusted frontend domains rather than allowing all origins. Always review your code and apply strict validation. Consult secure coding best practices.
