# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/78.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=command+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
# Verification:    OS command execution with shell=True or direct string passing allows RCE.

rule_id: js_exec_command_injection
language: javascript
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via child_process.exec() with user input
message: |-
  Using child_process.exec() with user-controlled input enables OS command injection because exec spawns a shell. Attackers can inject shell operators to run arbitrary commands.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- exec(
- child_process.exec(
sanitizers:
- execFile(
- spawn(
remediation: |-
  Use child_process.execFile() or spawn() which do not spawn a shell, and pass arguments as an array.

  UNSAFE:
    exec(`ls ${userInput}`);

  SAFE:
    execFile('ls', [userInput]); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
