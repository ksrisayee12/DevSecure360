rule_id: js_unsafe_dynamic_import
language: javascript
vuln_class: Code Injection
severity: Critical
cwe: CWE-470
owasp: A08:2021-Software and Data Integrity Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Unsafe Dynamic Import / Require
message: |-
  Passing user-controlled input directly to require() or import() allows attackers to load arbitrary local files or malicious modules, leading to RCE (Local File Inclusion / Module Hijacking).
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- require(
- import(
sanitizers:
- allowlist_check
remediation: |-
  Do not load modules dynamically based on user input. If necessary, use a switch statement or strict allowlist mapping. Always review your code and apply strict validation. Consult secure coding best practices.
