# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/22.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=path+traversal
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
# Verification:    User input in file paths without path sanitization allows arbitrary file read/write.

rule_id: js_path_traversal_fs_read
language: javascript
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via fs.readFile() or fs.readFileSync()
message: |-
  Concatenating user input into file paths passed to fs.readFile() allows attackers to read arbitrary files via directory traversal sequences (../).
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- fs.readFile(
- fs.readFileSync(
sanitizers:
- path.basename(
- path.resolve(
remediation: |-
  Use path.basename() to strip directory traversal sequences and resolve the path safely to ensure it stays within the expected base directory. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
