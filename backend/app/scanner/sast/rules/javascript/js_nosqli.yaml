sanitizers: []
remediation: |-
  Sanitize inputs by casting them to strings, or enforce schema validation to ensure inputs are strings and not objects containing NoSQL operators.

  UNSAFE:
    User.find({ username: req.body.username })

  SAFE:
    User.find({ username: String(req.body.username) })
