# Verification:    User input in LDAP queries without escaping enables auth bypass.

rule_id: js_ldap_injection
language: javascript
vuln_class: LDAP Injection
severity: Critical
cwe: CWE-90
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: LDAP Injection via unescaped string interpolation in ldapjs filters
message: |-
  Constructing LDAP filters dynamically with user input allows an attacker to alter the query logic, bypassing authentication or dumping directory contents.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- new ldap.FilterParser().parse(`(uid=${
- 'filter: `(uid=${'
sanitizers:
- ldapjs.escapeFilter(
remediation: |-
  Escape all user input using ldap escape functions before embedding it into LDAP filters. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
