rule_id: js_cmdi_spawn_shell
language: javascript
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: 'Command Injection via spawn with shell: true'
message: |-
  Using child_process.spawn() with the {shell: true} option passes arguments to a system shell, exposing the application to command injection if input is untrusted.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- child_process.spawn(
sanitizers: []
remediation: |-
  Never use the {shell: true} option with spawn when processing untrusted input. Pass arguments directly as an array instead.
