# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/798.html
# CodeQL Source:   Not applicable — pattern-based literal string detection
# Semgrep Source:  https://semgrep.dev/r?q=hardcoded+secret
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Hardcoded secret detection is pattern-based on string literal assignments. No HTTP taint source required.

rule_id: js_hardcoded_secret
language: javascript
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Hardcoded Secret or Credential
message: |-
  The application contains hardcoded secrets (API keys, passwords, tokens) in the source code. If the code is leaked or accessed by unauthorized individuals, the secrets can be extracted and abused.
sources: []
sinks:
- const apiKey =
- const api_key =
- const secret =
- const password =
sanitizers: []
remediation: |-
  Remove hardcoded secrets from source code. Load credentials dynamically from environment variables, configuration files securely provisioned at runtime, or a secrets management system.

  UNSAFE:
    const apiKey = 'sk-12345abcdef'

  SAFE:
    const apiKey = process.env.API_KEY
