# CWE Source:      https://cwe.mitre.org/data/definitions/338.html
# CodeQL Source:   Not applicable — pattern-based rule
# Semgrep Source:  https://semgrep.dev/r/javascript.lang.security.audit.insecure-randomization.insecure-randomization
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Math.random() is explicitly documented by Mozilla as insecure for cryptographic purposes.

rule_id: js_weak_crypto_randomness
language: javascript
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via Math.random
message: |-
  The application uses Math.random(), which is a cryptographically weak pseudo-random number generator (PRNG). If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- Math.random(
sanitizers: []
remediation: |-
  Use the crypto module in Node.js (crypto.randomBytes) or Web Crypto API in browsers (window.crypto.getRandomValues) for generating cryptographically strong random numbers.

  UNSAFE:
    let token = Math.random().toString(36);

  SAFE:
    let token = crypto.randomBytes(16).toString('hex');
