rule_id: js_missing_csp
language: javascript
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Content-Security-Policy header in Express.js responses
message: |-
  The Express.js application does not configure a Content-Security-Policy header. Without CSP, any XSS vulnerability has no browser-level defense to restrict script execution or resource loading. A successful XSS attack can steal session cookies, exfiltrate form data, or perform authenticated requests to the server on behalf of the victim user.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Configure a Content-Security-Policy using Helmet's contentSecurityPolicy middleware.

  UNSAFE: No Content-Security-Policy header configured in the Express pipeline.
  SAFE:
    const helmet = require("helmet");
    app.use(helmet.contentSecurityPolicy({
      directives: {
        defaultSrc: ["'self'"],
        scriptSrc: ["'self'"]
      }
    }));

  Test your policy with Google CSP Evaluator before deploying. Avoid using 'unsafe-inline' or 'unsafe-eval'.
