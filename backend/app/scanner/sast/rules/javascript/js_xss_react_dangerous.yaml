rule_id: js_xss_react_dangerous
language: javascript
vuln_class: XSS
severity: High
cwe: CWE-79
owasp: A03:2021-Injection
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: XSS via dangerouslySetInnerHTML in React
message: |-
  Untrusted data is passed to React's dangerouslySetInnerHTML prop, bypassing React's built-in XSS protection and rendering raw HTML.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- 'dangerouslySetInnerHTML={{ __html:'
sanitizers: []
remediation: |-
  Avoid dangerouslySetInnerHTML. If HTML must be rendered, aggressively sanitize the input using a library like DOMPurify before rendering.
