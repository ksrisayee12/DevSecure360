rule_id: js_xss_document_write
language: javascript
vuln_class: XSS
severity: High
cwe: CWE-79
owasp: A03:2021-Injection
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: DOM-based XSS via document.write
message: |-
  Untrusted data is written directly to the document using document.write() or document.writeln(), causing immediate execution of injected scripts.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- document.write(
- document.writeln(
sanitizers: []
remediation: |-
  Avoid using document.write() entirely. Use modern DOM manipulation methods like document.createElement() and textContent.
