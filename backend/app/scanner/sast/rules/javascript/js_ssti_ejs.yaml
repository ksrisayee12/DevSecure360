# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/94.html
# CodeQL Source:   Not applicable — pattern-based
# Semgrep Source:  https://semgrep.dev/r?q=ssti
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
# Verification:    Passing user input directly as a template string leads to Template Injection (SSTI).

rule_id: js_ssti_ejs
language: javascript
vuln_class: Code Injection
severity: Critical
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Server-Side Template Injection (SSTI) in EJS/Pug
message: |-
  Rendering templates dynamically with unvalidated user input as the template string (e.g., ejs.render(input)) allows attackers to inject malicious template code, leading to RCE.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- ejs.render(
- pug.render(
sanitizers:
- res.render(
remediation: |-
  Pass user input only as the data context/locals argument. Never use user input to construct the template string itself. Always ensure input validation and consult language-specific security documentation.
