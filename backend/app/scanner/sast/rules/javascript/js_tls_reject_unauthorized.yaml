rule_id: js_tls_reject_unauthorized
language: javascript
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: rejectUnauthorized: false'
message: |-
  Setting rejectUnauthorized: false in Node.js HTTPS requests or Axios configurations disables TLS certificate verification, exposing the request to MitM attacks.
sources: []
sinks:
- 'rejectUnauthorized: false'
- rejectUnauthorized:false
sanitizers:
- 'rejectUnauthorized: true'
remediation: |-
  Ensure rejectUnauthorized is set to true (or omitted, as true is the default) in production environments to validate server certificates. Always review your code and apply strict validation. Consult secure coding best practices.
