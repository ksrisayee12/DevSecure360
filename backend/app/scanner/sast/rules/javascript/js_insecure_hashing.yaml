# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/328.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/javascript/semmle/javascript/security/dataflow/BrokenCryptoAlgorithm.qll
# Semgrep Source:  https://semgrep.dev/r/javascript.lang.security.audit.crypto.weak-hash
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    MD5 and SHA1 are explicitly documented as cryptographically broken.

rule_id: js_insecure_hashing
language: javascript
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Insecure Hashing Algorithm (CWE-328)
message: |-
  The application uses a broken or weak cryptographic hashing algorithm such as MD5 or SHA1.
sources: []
sinks:
- crypto.createHash('md5')
- crypto.createHash('sha1')
sanitizers: []
remediation: |-
  Use strong hashing algorithms like SHA-256 or bcrypt for passwords.

  UNSAFE:
    let hash = crypto.createHash('md5');

  SAFE:
    let hash = crypto.createHash('sha256');
