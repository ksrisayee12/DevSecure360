rule_id: js_sqli_mysql2
language: javascript
vuln_class: SQLi
severity: High
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 8.5
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection in MySQL2
message: |-
  Queries are constructed using string concatenation with the mysql or mysql2 drivers. This directly introduces SQL injection vulnerabilities.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- pool.query(
- connection.query(
sanitizers: []
remediation: |-
