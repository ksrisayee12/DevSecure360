# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/611.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=xxe
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
# Verification:    XML parsers processing untrusted data without disabling DTDs allow XXE attacks.

rule_id: js_xxe_libxmljs
language: javascript
vuln_class: XXE
severity: High
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: XXE via libxmljs parsing with noent enabled
message: |-
  Parsing untrusted XML using libxmljs with the { noent: true } option enables entity expansion, leading to XML External Entity (XXE) attacks.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- libxmljs.parseXmlString(
- 'noent: true'
sanitizers:
- 'noent: false'
remediation: |-
  Ensure external entity resolution is disabled by omitting { noent: true } when parsing XML from untrusted sources. Always ensure input validation and consult language-specific security documentation.
