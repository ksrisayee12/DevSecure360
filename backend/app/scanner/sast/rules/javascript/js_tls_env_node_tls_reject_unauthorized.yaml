rule_id: js_tls_env_node_tls_reject_unauthorized
language: javascript
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: NODE_TLS_REJECT_UNAUTHORIZED = ''0'''
message: |-
  Setting the environment variable NODE_TLS_REJECT_UNAUTHORIZED to '0' globally disables TLS certificate verification for the entire Node.js process.
sources: []
sinks:
- process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
- process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
sanitizers:
- delete process.env
remediation: |-
  Never disable TLS validation globally. Handle self-signed certificates properly by providing a custom CA bundle in the request agent. Always review your code and apply strict validation. Consult secure coding best practices.
