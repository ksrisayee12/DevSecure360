rule_id: js_integer_overflow_bitwise
language: javascript
vuln_class: Integer Overflow
severity: Medium
cwe: CWE-190
owasp: A04:2021-Insecure Design
cvss_score: 5.5
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:L
confidence: Tentative
issue: Integer Overflow / Truncation via Bitwise Operators
message: |-
  Using bitwise operators (e.g., `| 0` or `<<`) in JavaScript truncates the Number to a 32-bit signed integer. If the original number is large, this silently overflows and alters logic.
sources: []
sinks:
- '| 0'
- << 0
sanitizers:
- Math.floor(
remediation: |-
  Avoid bitwise operators for rounding or type coercion of large numbers. Use Math.floor() or BigInt for safe arithmetic. Always review your code and apply strict validation. Consult secure coding best practices.
