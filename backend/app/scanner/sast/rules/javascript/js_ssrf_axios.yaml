# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/918.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=ssrf
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
# Verification:    User-controlled URLs passed to HTTP clients lead to SSRF, allowing internal network scanning.

rule_id: js_ssrf_axios
language: javascript
vuln_class: SSRF
severity: High
cwe: CWE-918
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: Server-Side Request Forgery (SSRF) via axios or fetch with unvalidated input
message: |-
  Passing user-controlled input directly to axios.get() or fetch() enables SSRF. The server will make arbitrary requests on behalf of the attacker, exposing internal networks.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- axios.get(
- axios.post(
- fetch(
sanitizers:
- new URL(
remediation: |-
  Strictly validate the user-provided URL against an allowlist. Resolve the DNS and verify it does not map to local/private IP ranges before making the request. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
