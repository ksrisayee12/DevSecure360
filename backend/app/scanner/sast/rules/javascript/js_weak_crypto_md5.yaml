rule_id: js_weak_crypto_md5
language: javascript
vuln_class: Weak Crypto
severity: High
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: 'Weak Cryptography: Usage of crypto.createHash(''md5'')'
message: |-
  The MD5 algorithm is cryptographically weak and vulnerable to collisions. Do not use it for passwords, secure tokens, or integrity verification.
sources: []
sinks:
- crypto.createHash('md5')
- crypto.createHash("md5")
sanitizers:
- crypto.createHash('sha256')
remediation: |-
  Switch to a modern cryptographic algorithm like SHA-256 for hashing, and use bcrypt or argon2 for storing passwords. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
