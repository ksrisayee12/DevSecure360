# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/798.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=hardcoded+secret
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
# Verification:    Hardcoded credentials/tokens in source verified from CodeQL and Semgrep secret detection registries.

rule_id: js_hardcoded_api_key
language: javascript
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded API key or secret token embedded in JavaScript source code
message: |-
  An API key, secret token, or authentication credential is hardcoded as a string literal in JavaScript source. Client-side JS is publicly accessible and any credential embedded in it is trivially extractable via browser DevTools. Server-side Node.js secrets in source files are exposed via version control, container image extraction, or process dumps.
sources: []
sinks:
- apiKey = "
- secretKey = "
- authToken = "
- privateKey = "
- client_secret = "
sanitizers:
- process.env.
- config.get(
remediation: |-
  Store all secrets in environment variables accessed via process.env. Never in JS source.

  UNSAFE:
    const apiKey = 'sk_live_ABCdef123456789';

  SAFE:
    const apiKey = process.env.API_KEY;
    if (!apiKey) throw new Error('API_KEY environment variable required');

  Never commit .env files. Use dotenv for local development and secrets managers (Vault, AWS SSM) for production. Scan with git-secrets or detect-secrets. See OWASP Secrets Management Cheat Sheet.
