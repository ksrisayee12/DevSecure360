confidence: Confirmed
issue: 'Weak Cryptography: Usage of DES or RC4 in crypto module'
message: |-
  Instantiating crypto.createCipher() or createCipheriv() with 'des', 'des3', or 'rc4' utilizes broken cryptographic algorithms vulnerable to various attacks.
sources: []
sinks:
- crypto.createCipher('des'
- crypto.createCipheriv('rc4'
sanitizers:
