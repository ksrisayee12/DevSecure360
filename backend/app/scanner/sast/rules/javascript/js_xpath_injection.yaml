sanitizers: []
remediation: |-
  Sanitize user input before using it in XPath queries, or prefer libraries that support parameterized querying.

  UNSAFE:
    xpath.select("//user[name='" + req.query.name + "']", doc);

  SAFE:
    // Validate input or safely escape user strings.
