rule_id: js_xpath_injection
language: javascript
vuln_class: XPath Injection
severity: High
cwe: CWE-643
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: XPath Injection
message: |-
  User input is used to construct an XPath query without sanitization. Attackers can modify the query logic to extract unauthorized data.
sources:
