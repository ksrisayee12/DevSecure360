# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/91.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/java/
# Semgrep Source:  https://semgrep.dev/r?q=xslt+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
# Verification:    XSLT processors evaluating user-controlled styles can execute code/read files.

rule_id: js_xslt_injection
language: javascript
vuln_class: Code Injection
severity: High
cwe: CWE-91
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: XSLT Injection via user-controlled stylesheet
message: |-
  Allowing an attacker to provide an XSLT stylesheet can lead to arbitrary code execution or file reading depending on the XSLT processor's configuration (e.g., node-xslt).
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- xsltProcess(
sanitizers:
- static stylesheet
remediation: |-
  Never process user-provided XSLT stylesheets. Use static, server-controlled stylesheets. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
