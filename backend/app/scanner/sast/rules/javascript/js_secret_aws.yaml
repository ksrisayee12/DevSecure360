rule_id: js_secret_aws
language: javascript
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded AWS Credentials
message: |-
  AWS access keys (e.g., AKIA...) or secret keys are hardcoded in the codebase, leading to full compromise of associated cloud resources.
sources: []
sinks:
- AWS_SECRET_ACCESS_KEY
