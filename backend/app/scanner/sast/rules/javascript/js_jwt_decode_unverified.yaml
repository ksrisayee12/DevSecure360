# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
# Verification:    Allowing the 'none' algorithm or skipping signature verification bypasses JWT authentication.

rule_id: js_jwt_decode_unverified
language: javascript
vuln_class: JWT Bypass
severity: Critical
cwe: CWE-287
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: JWT Validation Bypass via jwt.decode() instead of verify()
message: |-
  Using jsonwebtoken's `jwt.decode()` function decodes the token payload without validating the signature. Attackers can trivially spoof their identity by modifying the payload.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- jwt.decode(
sanitizers:
- jwt.verify(
remediation: |-
  Always use `jwt.verify()` with a secure secret key to validate the signature and decode the token simultaneously. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
