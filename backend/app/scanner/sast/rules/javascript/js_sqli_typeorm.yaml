rule_id: js_sqli_typeorm
language: javascript
vuln_class: SQLi
severity: High
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 8.5
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection in TypeORM
message: |-
  User input is directly concatenated into a TypeORM queryBuilder or raw query. This can lead to SQL injection attacks that compromise the database.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- getRepository().query(
- createQueryBuilder().where(
sanitizers: []
remediation: |-
  Use parameterized queries with TypeORM queryBuilder using setParameters or pass parameters as the second argument to raw query functions.
