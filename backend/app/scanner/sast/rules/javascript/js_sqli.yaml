rule_id: js_sqli
language: javascript
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via unparameterized queries
message: |-
  User-controlled data flows into a database query without being parameterized. An attacker can manipulate the query structure to bypass authentication, access unauthorized data, or modify/delete records.
sources:
- req.query.
- req.query[
- req.body.
- req.body[
- req.params.
- req.params[
- req.headers[
- req.cookies.
- req.cookies[
- req.get(
- request.query.
- request.body.
- request.params.
- request.headers[
- process.env.
- process.argv[
- readline.question(
sinks:
- connection.query(
- pool.query(
- db.query(
- client.query(
- sequelize.query(
- knex.raw(
- knex.whereRaw(
- .query(
sanitizers: []
remediation: |-
  Use parameterized queries provided by the database driver or ORM. Never concatenate user input directly into SQL strings.

  UNSAFE:
    db.query(`SELECT * FROM users WHERE id = ${req.query.id}`)

  SAFE:
    db.query('SELECT * FROM users WHERE id = ?', [req.query.id])
