rule_id: js_cleartext_transmission
language: javascript
vuln_class: Cleartext Transmission
severity: High
cwe: CWE-319
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.4
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Cleartext Transmission of Sensitive Information
message: |-
  The application transmits data in cleartext using HTTP instead of a secure protocol (HTTPS). This exposes data to man-in-the-middle (MITM) attacks.
sources: []
sinks:
- axios.get("http://
- axios.post("http://
- fetch("http://
- http.get(
sanitizers: []
remediation: |-
  Use secure transport protocols like HTTPS for all network communications.

  UNSAFE:
    axios.get('http://api.example.com/data')

  SAFE:
    axios.get('https://api.example.com/data')
