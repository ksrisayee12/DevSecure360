remediation: |-
  Always sanitize user input before reflecting it in HTML responses, or use safe sinks like textContent. See OWASP XSS Prevention Cheat Sheet for complete guidance.

  UNSAFE:
    res.send('<h1>Hello ' + req.query.name + '</h1>');

  SAFE:
    res.send('<h1>Hello ' + escapeHTML(req.query.name) + '</h1>');
