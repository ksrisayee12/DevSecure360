# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/434.html
# CodeQL Source:   Not applicable — pattern-based upload detection
# Semgrep Source:  https://semgrep.dev/r?q=file+upload
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
# Verification:    Missing extension and content validation on file uploads allows Remote Code Execution via web shells.

rule_id: js_insecure_file_upload_extension
language: javascript
vuln_class: File Upload
severity: Critical
cwe: CWE-434
owasp: A04:2021-Insecure Design
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: 'Insecure File Upload: Missing File Extension Validation'
message: |-
  Accepting file uploads (e.g., via multer) without validating the file extension allows attackers to upload executable files (e.g., .php, .js) leading to RCE.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- upload.single(
- upload.array(
sanitizers:
- fileFilter
remediation: |-
  Implement a strict fileFilter function in multer that checks the file extension and MIME type against an allowlist of permitted formats. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
