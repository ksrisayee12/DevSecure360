rule_id: js_dos_billion_laughs_sax
language: javascript
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via XML Entity Expansion (sax/xml2js)
message: |-
  Parsing untrusted XML using libraries that do not inherently limit entity expansion depth allows the Billion Laughs attack, crashing the Node.js process.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
sinks:
- parseString(
- sax.parser(
sanitizers:
- disable entities
remediation: |-
  Ensure the XML parser is configured to reject external entities and limit expansion depth to prevent DoS. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
