rule_id: js_file_upload
language: javascript
vuln_class: File Upload
severity: High
cwe: CWE-434
owasp: A04:2021-Insecure Design
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Unrestricted Upload of File with Dangerous Type
message: |-
  The application allows users to upload files without adequate validation. Using multer without fileFilter can allow attackers to upload executable files.
sources: []
sinks:
- 'multer({ dest:'
sanitizers:
- 'fileFilter:'
remediation: |-
  Configure your upload middleware (like multer) to strictly filter allowed file extensions and MIME types.

  UNSAFE:
    const upload = multer({ dest: 'uploads/' })

  SAFE:
    const upload = multer({ dest: 'uploads/', fileFilter: safeFilter })
