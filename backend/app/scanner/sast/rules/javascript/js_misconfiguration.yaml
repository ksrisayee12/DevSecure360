# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/16.html
# CodeQL Source:   Not applicable — structural configuration detection
# Semgrep Source:  https://semgrep.dev/r?q=misconfiguration
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
# Verification:    Misconfiguration detection is structural, checking for presence of insecure settings. Rule is Tentative.

rule_id: js_misconfiguration
language: javascript
vuln_class: Misconfiguration
severity: Low
cwe: CWE-16
owasp: A05:2021-Security Misconfiguration
cvss_score: 4.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Generic Security Misconfiguration
message: |-
  The application is missing standard security hardening headers or configurations, such as failing to disable the X-Powered-By header.
sources: []
sinks:
- app.enable('x-powered-by')
- app.set('x-powered-by', true)
sanitizers:
- app.disable('x-powered-by')
remediation: |-
  Disable the X-Powered-By header to avoid leaking the server technology stack.

  UNSAFE:
    // omitting app.disable('x-powered-by')

  SAFE:
    app.disable('x-powered-by')
