rule_id: js_function_constructor
language: javascript
vuln_class: Code Injection
severity: Critical
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Code Injection via new Function() constructor with user-controlled source string
  — eval equivalent
message: |-
  User-controlled data is passed to the Function() constructor or new Function() to dynamically create and execute JavaScript code. The Function constructor is functionally equivalent to eval() — it compiles and executes arbitrary JavaScript in the current scope. An attacker can inject code to exfiltrate data, make unauthorized API calls, or compromise the application.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
- window.location
sinks:
- new Function(
- Function(userInput
- Function(`
- new Function(`
sanitizers:
- sandbox
- vm.runInNewContext(
remediation: |-
  Never use new Function() with user-controlled input. Use a safe expression library instead.

  UNSAFE:
    const fn = new Function('x', req.body.code);
    fn(data);

  SAFE:
    // For math expressions use a safe evaluator:
    const { evaluate } = require('mathjs');
    const result = evaluate(req.body.expression);

  If sandboxed execution is required, use the vm module with strict resource limits. See OWASP Injection Prevention Cheat Sheet.
