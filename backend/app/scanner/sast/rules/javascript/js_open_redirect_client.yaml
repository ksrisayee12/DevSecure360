# Verification:    DOM XSS (postMessage, location.href) sinks verified from CodeQL JS DOM standard libraries.

rule_id: js_open_redirect_client
language: javascript
vuln_class: Open Redirect
severity: Medium
cwe: CWE-601
owasp: A01:2021-Broken Access Control
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Client-side Open Redirect via window.location.href or location.assign() with
  user-controlled URL
message: |-
  The JavaScript application sets window.location.href, location.assign(), or location.replace() to a URL derived from user-controlled input (URL parameter, postMessage, localStorage) without validating it against a trusted domain allowlist. An attacker can supply a crafted URL that redirects victims to a phishing or malware site after interacting with a trusted application URL.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
- window.location
sinks:
- 'window.location.href = '
- location.assign(
- location.replace(
- 'window.location = '
sanitizers:
- allowedDomains
- isValidRedirectUrl(
remediation: |-
  Validate the redirect URL against an allowlist of trusted domains before assignment.

  UNSAFE:
    const redirect = new URLSearchParams(window.location.search).get('next');
    window.location.href = redirect;  /* open redirect */

  SAFE:
    const allowed = ['https://app.example.com', 'https://api.example.com'];
    const redirect = new URLSearchParams(window.location.search).get('next');
    if (allowed.some(u => redirect.startsWith(u))) {
        window.location.href = redirect;
    }

  See OWASP Unvalidated Redirects and Forwards Cheat Sheet.
