# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/208.html
# CodeQL Source:   Not applicable — pattern-based comparison detection
# Semgrep Source:  https://semgrep.dev/r?q=timing+attack
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Non-constant-time comparison for cryptographic secrets detected structurally. Rule is Tentative.

rule_id: js_timing_attack
language: javascript
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-208
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: Timing attack via === or == comparison of HMAC or secret token instead of timingSafeEqual
message: |-
  Node.js === operator for Buffer or string comparison short-circuits on the first differing byte, leaking comparison time via network latency measurements. An attacker making repeated requests with varying tokens can statistically determine the correct HMAC byte-by-byte, forging authentication tokens or API signatures over thousands of requests.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
sinks:
- === token
- == expectedMac
- .toString() ===
sanitizers:
- crypto.timingSafeEqual(
- timingSafeCompare(
remediation: |-
  Use crypto.timingSafeEqual() from Node's built-in crypto module for all HMAC comparisons.

  UNSAFE:
    if (providedToken === expectedToken) { /* timing leak */ }
    if (computedMac === requestMac) { /* timing leak */ }

  SAFE:
    const crypto = require('crypto');
    const safe = crypto.timingSafeEqual(
      Buffer.from(providedToken),
      Buffer.from(expectedToken)
    );

  Both Buffers must be the same length. See Node.js crypto docs and OWASP Cryptographic Storage Cheat Sheet.
