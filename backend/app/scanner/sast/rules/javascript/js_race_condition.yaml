rule_id: js_race_condition
language: javascript
vuln_class: Race Condition
severity: Medium
cwe: CWE-362
owasp: A01:2021-Broken Access Control
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:N
confidence: Tentative
issue: Time-of-check Time-of-use (TOCTOU) Race Condition
message: |-
  The application checks for the existence or permissions of a file (fs.existsSync) before operating on it. An attacker can alter the file between the check and the use.
sources:
- fs.existsSync(
- fs.accessSync(
sinks:
- fs.readFileSync(
- fs.writeFileSync(
- fs.readFile(
- fs.writeFile(
sanitizers: []
remediation: |-
  Do not check for file existence before opening it. Instead, attempt the file operation directly and handle the resulting error (e.g., ENOENT).

  UNSAFE:
    if (fs.existsSync(path)) { fs.readFileSync(path); }

  SAFE:
    try { fs.readFileSync(path); } catch (e) { /* handle */ }
