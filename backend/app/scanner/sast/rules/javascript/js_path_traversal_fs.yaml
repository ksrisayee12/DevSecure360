rule_id: js_path_traversal_fs
language: javascript
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via File System API
message: |-
  User input is passed to Node.js fs methods (e.g., readFile, createReadStream) without sanitization, allowing attackers to access unauthorized files on the server.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- fs.readFile(
- fs.readFileSync(
- fs.createReadStream(
sanitizers: []
remediation: |-
  Validate and normalize file paths using path.resolve() and ensure the resulting path strictly resides within the intended base directory.
