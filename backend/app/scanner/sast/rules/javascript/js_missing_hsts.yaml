rule_id: js_missing_hsts
language: javascript
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Strict-Transport-Security (HSTS) header in Express.js HTTP responses
message: |-
  The Express.js application does not set the Strict-Transport-Security response header. Without HSTS, browsers that initially connect over HTTP are not instructed to use HTTPS, leaving them vulnerable to SSL-stripping man-in-the-middle attacks. Intercepted connections expose session tokens, credentials, and sensitive user data.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Enable HSTS using the Helmet middleware which sets this and other security headers by default.

  UNSAFE: No HSTS header set; plain HTTP connections are not rejected.
  SAFE:
    const helmet = require("helmet");
    app.use(helmet({
      hsts: { maxAge: 31536000, includeSubDomains: true, preload: true }
    }));

  Ensure your server also redirects all HTTP traffic to HTTPS before relying on HSTS enforcement.
