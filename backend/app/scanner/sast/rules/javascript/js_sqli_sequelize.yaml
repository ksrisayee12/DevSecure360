# Verification:    SQL injection sinks verified from CodeQL standard libraries and Semgrep registry for the respective language.

rule_id: js_sqli_sequelize
language: javascript
vuln_class: SQLi
severity: High
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 8.5
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection in Sequelize
message: |-
  User input is directly concatenated into a raw SQL query executed via Sequelize. An attacker can manipulate the query to extract sensitive data or modify the database.
sources:
- req.body
- req.query
- req.params
- req.headers
- req.cookies
- window.location
- document.cookie
- process.argv
- process.env
sinks:
- sequelize.query(
- 'Model.findAll({where:'
sanitizers: []
remediation: |-
  Always use Sequelize's built-in parameterized replacements (e.g., replacements: { param: value }) or bind parameters instead of string concatenation.
