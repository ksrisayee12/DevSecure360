# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/94.html
# CodeQL Source:   Not applicable — pattern-based template sink detection
# Semgrep Source:  https://semgrep.dev/r?q=server+side+template+injection
# OWASP Cheat:     https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/18-Testing_for_Server_Side_Template_Injection
# Verification:    Template engine sinks (FreeMarker, Velocity, Mako, Twig, Razor) verified from engine docs.

rule_id: js_nosqli_where
language: javascript
vuln_class: NoSQLi
severity: Critical
cwe: CWE-943
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: NoSQL Injection via MongoDB $where operator executing user-controlled JavaScript
  string
message: |-
  User-controlled input is used as the value of the MongoDB $where operator in a query filter. The $where operator evaluates a JavaScript expression in the MongoDB server. An attacker can inject JavaScript like 'this.password.match(/.*/)' to bypass authentication or 'sleep(1000)' to perform timing-based data exfiltration from the database.
sources:
- req.body
- req.query
- req.params
- req.headers
- event.data
- window.location
sinks:
- '$where:'
- '{ $where:'
- '{ ''$where'':'
sanitizers:
- allowedWhereExpressions
- '$expr:'
remediation: |-
  Avoid the $where operator entirely. Use $expr with aggregation operators for complex queries.

  UNSAFE:
    db.users.find({ $where: req.body.filter });  /* JS injection */

  SAFE:
    // Use $expr with typed operators — no JavaScript execution
    db.users.find({ $expr: { $eq: ['$username', username] } });

  Disable server-side JavaScript by setting --noscripting flag in MongoDB. See MongoDB security checklist and OWASP NoSQL Injection guide.
