rule_id: java_csrf_disabled
language: java
vuln_class: Misconfiguration
severity: High
cwe: CWE-352
owasp: A01:2021-Broken Access Control
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:N
confidence: Tentative
issue: CSRF Protection Disabled in Spring Security Configuration
message: |-
  Disabling CSRF protection via http.csrf().disable() leaves the application vulnerable to Cross-Site Request Forgery attacks if cookie-based authentication is used.
sources: []
sinks:
- csrf().disable()
- csrf(csrf -> csrf.disable())
sanitizers:
- csrf()
remediation: |-
  Do not disable CSRF protection unless the API relies entirely on stateless authentication (like JWT in headers). Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
