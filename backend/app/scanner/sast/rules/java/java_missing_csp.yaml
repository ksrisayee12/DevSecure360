rule_id: java_missing_csp
language: java
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Content-Security-Policy header in Spring Security configuration
message: |-
  The Spring application does not configure a Content-Security-Policy response header via Spring Security. Without CSP, any XSS vulnerability has no browser-level enforcement layer to restrict script execution or data exfiltration. A successful XSS attack can steal authenticated session tokens and perform actions on behalf of the victim.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Configure a Content-Security-Policy header in Spring Security.

  UNSAFE: No CSP configured in Spring Security headers block.
  SAFE:
    http.headers(headers -> headers
        .contentSecurityPolicy(csp -> csp
            .policyDirectives("default-src 'self'; script-src 'self'")
        )
    );

  Test the policy with Google CSP Evaluator. Avoid unsafe-inline and unsafe-eval directives.
