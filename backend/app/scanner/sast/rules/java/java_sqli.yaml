- NamedParameterJdbcTemplate
remediation: |-
  Use parameterized queries via PreparedStatement or use safe ORM methods (like JPA named parameters). Never concatenate user input directly into SQL strings.

  UNSAFE:
    String query = "SELECT * FROM users WHERE name='" + user + "'";
    statement.executeQuery(query);

  SAFE:
    PreparedStatement ps = conn.prepareStatement("SELECT * FROM users WHERE name=?");
    ps.setString(1, user);
    ps.executeQuery();
