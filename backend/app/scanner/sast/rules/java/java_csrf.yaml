rule_id: java_csrf
language: java
vuln_class: CSRF
severity: High
cwe: CWE-352
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Cross-Site Request Forgery (CSRF) Protection Disabled
message: |-
  The application explicitly disables CSRF protection in its Spring Security configuration. Attackers can trick authenticated users into executing unwanted actions.
sources: []
sinks:
- csrf().disable()
sanitizers: []
remediation: |-
  Do not disable CSRF protection unless the endpoint is stateless (e.g., API) and uses a secure alternative (like JWT).

  UNSAFE:
    http.csrf().disable();

  SAFE:
    // Leave CSRF enabled for stateful web apps
