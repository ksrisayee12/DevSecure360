rule_id: java_redos_pattern
language: java
vuln_class: ReDoS
severity: Medium
cwe: CWE-1333
owasp: A01:2021-Broken Access Control
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
confidence: Tentative
issue: ReDoS via java.util.regex.Pattern
message: |-
  Compiling regular expressions from untrusted input or evaluating complex static regexes against long malicious strings can cause catastrophic backtracking in Java's Regex engine.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- Pattern.compile(
- matcher.matches(
sanitizers:
- RE2J
remediation: |-
  Avoid complex regex structures with nested quantifiers. Limit the input length strictly, or use the RE2J library which guarantees linear-time execution. Always ensure input validation and consult language-specific security documentation.
