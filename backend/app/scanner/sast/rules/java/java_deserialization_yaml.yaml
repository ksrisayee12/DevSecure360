# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/502.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=deserialization
