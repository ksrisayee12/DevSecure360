# Verification:    Disabling TLS certificate validation allows Man-in-the-Middle (MitM) attacks. Tentative.

rule_id: java_tls_hostname_verifier
language: java
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: HostnameVerifier returning true'
message: |-
  Implementing a custom HostnameVerifier that simply returns true ignores hostname mismatches in TLS certificates, leaving the connection vulnerable to MitM attacks.
sources: []
sinks:
- implements HostnameVerifier
- return true;
sanitizers:
- SSLParameters.setEndpointIdentificationAlgorithm
remediation: |-
  Do not bypass hostname verification. Allow the default Java hostname verifier to ensure the certificate matches the requested host. Always review your code and apply strict validation. Consult secure coding best practices.
