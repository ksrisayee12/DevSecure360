# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/117.html
# CodeQL Source:   Not applicable — pattern-based log sink detection
# Semgrep Source:  https://semgrep.dev/r?q=log+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
# Verification:    Unsanitized CRLF characters in logs allow spoofing log entries (Log Forging).

rule_id: java_log_injection_slf4j
language: java
vuln_class: Log Injection
severity: Medium
cwe: CWE-117
owasp: A09:2021-Security Logging and Monitoring Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection via SLF4J / Log4j string concatenation
message: |-
  Including unvalidated user input directly into log messages allows an attacker to inject CRLF characters to forge new log lines.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- log.info(
- logger.error(
sanitizers:
- replaceAll("\\r|\\n","")
remediation: |-
  Strip CRLF characters from user input before logging, or utilize structured logging formats like JSON that automatically escape newline characters. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
