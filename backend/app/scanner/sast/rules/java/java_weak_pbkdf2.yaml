# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=pbkdf2+weak+iterations
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
# Verification:    NIST SP 800-132 recommends >=310,000 PBKDF2-SHA256 iterations as of 2023.

rule_id: java_weak_pbkdf2
language: java
vuln_class: Weak Crypto
severity: High
cwe: CWE-916
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Weak key derivation via PBEKeySpec with iteration count below NIST SP 800-132
  minimum (310,000)
message: |-
  The application uses javax.crypto.SecretKeyFactory with PBEKeySpec specifying an iteration count below 310,000 for PBKDF2-SHA256 (NIST SP 800-132 2023 recommendation). Password cracking tools (Hashcat) can test millions of PBKDF2-SHA256 iterations per second on consumer GPUs. Too few iterations make the entire password database crackable after breach.
sources: []
sinks:
- new PBEKeySpec(
- PBEKeySpec(password
sanitizers:
- BCrypt.hashpw(
- Argon2PasswordEncoder(
remediation: |-
  Use >= 310,000 iterations for PBKDF2-SHA256, or switch to bcrypt/Argon2id.

  UNSAFE:
    KeySpec spec = new PBEKeySpec(password, salt, 1000, 256);  /* too low */

  SAFE:
    KeySpec spec = new PBEKeySpec(password, salt, 310000, 256);

  BETTER (Spring Security):
    Argon2PasswordEncoder encoder = Argon2PasswordEncoder.defaultsForSpringSecurity_v5_8();
    String hash = encoder.encode(rawPassword);

  See NIST SP 800-132, OWASP Password Storage Cheat Sheet, and Spring Security docs.
