# Verification:    Directory traversal in file delete/upload functions allows destructive actions or RCE.

rule_id: java_path_traversal_file_delete
language: java
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H
confidence: Confirmed
issue: Arbitrary File Deletion via File.delete()
message: |-
  Using unvalidated user input to specify a path for File.delete() or Files.delete() allows directory traversal, potentially causing data loss or denial of service.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- file.delete(
- Files.delete(
sanitizers:
- Paths.get(
remediation: |-
  Sanitize the filename to strip directory traversal payloads and ensure the canonical path verifies it lies within the required target directory. Always ensure input validation and consult language-specific security documentation.
