sanitizers: []
remediation: |-
  Never pass user-controlled data to JNDI lookup methods. If JNDI lookups are required, use a strict allowlist of permitted JNDI names and validate the input before passing it to lookup().

  UNSAFE:
    Context ctx = new InitialContext();
    ctx.lookup(request.getParameter("resource"));

  SAFE:
    // Validate that 'resource' is in the allowlist of known safe JNDI names
    if (ALLOWED_RESOURCES.contains(resource)) {
        ctx.lookup(resource);
    }
