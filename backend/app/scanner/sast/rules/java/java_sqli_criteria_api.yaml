rule_id: java_sqli_criteria_api
language: java
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via JPA CriteriaBuilder.literal() with user-supplied string value
message: |-
  The JPA Criteria API is used with cb.literal(userInput) which embeds the value as a SQL literal rather than a parameterized expression. While type-safe for column references, using literal() with user input bypasses parameterization. An attacker can inject SQL fragments to bypass WHERE clause logic and access unauthorized data rows.
sources:
- request.getParameter(
- request.getHeader(
- request.getQueryString(
- request.getInputStream(
- request.getCookies(
- request.getReader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- cb.literal(
- criteriaBuilder.literal(
sanitizers:
- cb.parameter(
- criteriaBuilder.parameter(
remediation: |-
  Use CriteriaBuilder.parameter() for all user-supplied values instead of cb.literal().

  UNSAFE:
    Predicate p = cb.equal(root.get("name"), cb.literal(userInput));

  SAFE:
    ParameterExpression<String> param = cb.parameter(String.class);
    Predicate p = cb.equal(root.get("name"), param);
    query.setParameter(param, userInput);

  See JPA Criteria API documentation and OWASP SQL Injection Prevention Cheat Sheet.
