rule_id: java_path_traversal
language: java
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via File IO
message: |-
  User input dictates the file path used in File objects or streams. Attackers can use traversal sequences ('../') to read or write files outside the intended directory.
sources:
- request.getParameter(
- request.getParameterValues(
- request.getHeader(
