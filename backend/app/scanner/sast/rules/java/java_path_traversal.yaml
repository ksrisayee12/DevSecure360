sanitizers: []
remediation: |-
  Validate file paths to ensure they reside within the expected base directory. Check the canonical path of the resolved file against the base directory.

  UNSAFE:
    File f = new File("/uploads/" + request.getParameter("file"));

  SAFE:
    File baseDir = new File("/uploads/");
    File f = new File(baseDir, request.getParameter("file"));
    if (!f.getCanonicalPath().startsWith(baseDir.getCanonicalPath())) throw new Exception();
