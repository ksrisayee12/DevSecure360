rule_id: java_missing_xcontent_type
language: java
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing X-Content-Type-Options header in Spring Security configuration
message: |-
  The Spring application does not set the X-Content-Type-Options: nosniff response header via Spring Security. Without this header browsers can MIME-sniff content types, potentially treating user-uploaded files as executable scripts. This significantly amplifies the impact of any file upload vulnerability present in the application.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Enable content type options in Spring Security headers.

  UNSAFE: contentTypeOptions disabled or not configured.
  SAFE:
    http.headers(headers -> headers
        .contentTypeOptions(Customizer.withDefaults())
    );
    // Spring Security enables nosniff by default — verify it has not been explicitly disabled.

  Verify using browser developer tools that X-Content-Type-Options: nosniff appears in all responses.
