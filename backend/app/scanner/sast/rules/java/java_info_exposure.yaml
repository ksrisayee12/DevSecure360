# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/209.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/java/semmle/code/java/security/StackTraceExposure.qll
# Semgrep Source:  https://semgrep.dev/r/java.lang.security.audit.stack-trace-exposure
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
# Verification:    Writing stack traces to the HttpServletResponse violates CWE-209 by exposing internal details.

rule_id: java_info_exposure
language: java
vuln_class: Information Exposure
severity: Low
cwe: CWE-209
owasp: A05:2021-Security Misconfiguration
cvss_score: 4.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Information Exposure through an Error Message (CWE-209)
message: |-
  The application writes raw exception details (stack traces) directly to the HTTP response. This exposes internal application structure and logic to attackers.
sources:
- 'catch (Exception '
sinks:
- printStackTrace(response.getWriter())
- response.getWriter().print(e.getMessage())
- response.sendError(500, e.getMessage())
sanitizers: []
remediation: |-
  Do not expose exception details to users. Log the exception internally and return a generic error message.

  UNSAFE:
    catch (Exception e) { e.printStackTrace(response.getWriter()); }

  SAFE:
    catch (Exception e) { logger.error(e); response.getWriter().print("An error occurred."); }
