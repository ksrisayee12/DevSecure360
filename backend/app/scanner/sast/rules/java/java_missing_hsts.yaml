rule_id: java_missing_hsts
language: java
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Strict-Transport-Security (HSTS) header in Spring Security configuration
message: |-
  The Spring application does not configure Strict-Transport-Security via Spring Security HTTP headers. Without HSTS, browsers are not forced to use HTTPS for subsequent requests, leaving users vulnerable to SSL-stripping and man-in-the-middle attacks. Intercepted connections expose session tokens, credentials, and sensitive application data.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Enable HSTS in Spring Security HttpSecurity configuration.

  UNSAFE: No HSTS configured — Spring Security default may omit this header.
  SAFE:
    http.headers(headers -> headers
        .httpStrictTransportSecurity(hsts -> hsts
            .includeSubDomains(true)
            .maxAgeInSeconds(31536000)
            .preload(true)
        )
    );

  HSTS only works over HTTPS; also call http.requiresChannel().anyRequest().requiresSecure().
