# Verification:    Using wildcard (*) for CORS Access-Control-Allow-Origin exposes APIs to cross-origin attacks. Tentative.

rule_id: java_cors_wildcard_spring
language: java
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: 'CORS Misconfiguration: Spring @CrossOrigin("*")'
message: |-
  Applying the @CrossOrigin("*") annotation to Spring Controllers exposes the endpoints to requests from any origin, violating the principle of least privilege.
sources: []
sinks:
- '@CrossOrigin("*")'
- registry.addMapping("/**").allowedOrigins("*")
sanitizers:
- allowedOrigins("https://trust.com")
remediation: |-
  Specify allowed origins explicitly using the allowedOrigins attribute, avoiding the wildcard '*'. Always review your code and apply strict validation. Consult secure coding best practices.
