# CWE Source:      https://cwe.mitre.org/data/definitions/89.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/java/semmle/code/java/security/SqlInjection.qll
# Semgrep Source:  https://semgrep.dev/r?q=sql+injection+java
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
# Verification:    Hibernate, JdbcTemplate, JPA, MyBatis sinks verified from CodeQL Java standard libraries.

rule_id: java_sqli_mybatis
language: java
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: 'SQL Injection via MyBatis string substitution ${} syntax instead of #{} parameterized
  binding'
message: |-
  The MyBatis mapper uses ${paramName} string substitution instead of the safe #{paramName} syntax. ${} performs direct string replacement into the SQL statement, bypassing the prepared statement mechanism entirely. An attacker who controls the parameter value can inject arbitrary SQL to exfiltrate or manipulate all database data accessible by the application's DB account.
sources:
- request.getParameter(
- request.getHeader(
- request.getQueryString(
- request.getInputStream(
- request.getCookies(
- request.getReader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- ${
- ORDER BY ${
- WHERE ${
- TABLE ${
sanitizers:
- '#{'
remediation: |-
  Replace all ${} substitutions with #{} parameterized bindings in MyBatis mapper XML.

  UNSAFE (mapper XML):
    SELECT * FROM users WHERE name = ${name}

  SAFE:
    SELECT * FROM users WHERE name = #{name}

  The only legitimate use of ${} is for dynamic column/table names from server-controlled sources, never for user input. See MyBatis documentation on Dynamic SQL and OWASP SQL Injection Cheat Sheet.
