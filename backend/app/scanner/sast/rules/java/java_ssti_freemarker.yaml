# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/94.html
# CodeQL Source:   Not applicable — pattern-based template sink detection
# Semgrep Source:  https://semgrep.dev/r?q=server+side+template+injection
# OWASP Cheat:     https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/18-Testing_for_Server_Side_Template_Injection
# Verification:    Template engine sinks (FreeMarker, Velocity, Mako, Twig, Razor) verified from engine docs.

rule_id: java_ssti_freemarker
language: java
vuln_class: SSTI
severity: Critical
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Server-Side Template Injection via Apache FreeMarker Template.process() with
  user-controlled template
message: |-
  User-controlled input is used as the FreeMarker template string passed to new Template() or cfg.getTemplate() with a StringTemplateLoader. FreeMarker templates can call Java methods via the ?api built-in or freemarker.template.utility.Execute class. An attacker can inject ${"freemarker.template.utility.Execute"?new()("id")} to execute arbitrary OS commands.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
- request.getReader(
sinks:
- new Template(
- cfg.getTemplate(
- template.process(
- new StringTemplateLoader(
sanitizers:
- SecurityTemplateExceptionHandler
- allowedTemplates
remediation: |-
  Never load user-controlled strings as FreeMarker template sources. Use pre-approved template files.

  UNSAFE:
    Template tmpl = new Template("t", new StringReader(userInput), cfg);
    tmpl.process(model, writer);

  SAFE:
    cfg.setTemplateLoader(new ClassTemplateLoader(getClass(), "/templates/"));
    Template tmpl = cfg.getTemplate("safe-page.ftl");  /* server-controlled */
    tmpl.process(model, writer);

  Configure FreeMarker with api_builtin_enabled=false to prevent ?api exploitation. See CVE-2015-1000007 and OWASP SSTI testing guide.
