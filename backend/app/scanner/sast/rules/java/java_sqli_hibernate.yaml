rule_id: java_sqli_hibernate
language: java
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via Hibernate session.createQuery() with HQL string concatenation
message: |-
  User-controlled data from an HTTP request is concatenated into a Hibernate HQL query string passed to session.createQuery(). An attacker can inject HQL metacharacters to alter query logic, bypass authentication, dump all rows, or modify data. Hibernate HQL is NOT a security boundary against string concatenation — parameterization is required.
sources:
- request.getParameter(
- request.getHeader(
- request.getQueryString(
- request.getInputStream(
- request.getCookies(
- request.getReader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- session.createQuery(
- session.createSQLQuery(
sanitizers:
- setParameter(
- setString(
- setInteger(
remediation: |-
  Replace HQL string concatenation with named parameters using Hibernate's setParameter API.

  UNSAFE:
    String hql = "FROM User WHERE name = '" + userInput + "'";
    session.createQuery(hql).list();

  SAFE:
    session.createQuery("FROM User WHERE name = :name")
        .setParameter("name", userInput).list();

  See OWASP SQL Injection Prevention Cheat Sheet for complete Hibernate parameterization guidance.
