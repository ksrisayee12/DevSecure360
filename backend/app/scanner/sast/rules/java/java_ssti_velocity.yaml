rule_id: java_ssti_velocity
language: java
vuln_class: SSTI
severity: Critical
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Server-Side Template Injection via Apache Velocity VelocityEngine.evaluate()
  with user input
message: |-
  User-controlled input is evaluated as a Velocity template string via VelocityEngine.evaluate() or Velocity.evaluate(). Velocity templates can reference Java classes via #set directives and the velocimacro runtime. An attacker can inject #set($x='')#set($rt=$x.class.forName('java.lang.Runtime'))$rt.exec('id') to execute arbitrary OS commands.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
- request.getReader(
sinks:
- Velocity.evaluate(
- velocityEngine.evaluate(
- ve.evaluate(
- VelocityContext
sanitizers:
- mergeTemplate(
- getTemplate(
remediation: |-
  Use Velocity's mergeTemplate() with server-controlled template files. Never evaluate user strings.

  UNSAFE:
    Velocity.evaluate(context, writer, "inline", userInput);

  SAFE:
    VelocityEngine ve = new VelocityEngine();
    ve.init();
    ve.mergeTemplate("templates/safe.vm", "UTF-8", context, writer);

  Pass user data as Velocity context variables, not as template source code. See Velocity security best practices and OWASP SSTI testing guide.
