rule_id: java_open_redirect_sendredirect
language: java
vuln_class: Open Redirect
severity: Medium
cwe: CWE-601
owasp: A01:2021-Broken Access Control
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Open Redirect via HttpServletResponse.sendRedirect()
message: |-
  Passing unvalidated input from query parameters directly into sendRedirect() allows attackers to redirect users to malicious external domains.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- response.sendRedirect(
sanitizers:
- URI validate
remediation: |-
  Validate the URL to ensure it is a relative path (e.g., starts with '/') or matches an allowed domain list. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
