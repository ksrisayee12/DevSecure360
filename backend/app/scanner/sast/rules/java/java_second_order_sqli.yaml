# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/89.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=second+order+sql+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
# Verification:    Second-order SQLi via stored data re-used in raw query verified from CodeQL and OWASP testing guides.

rule_id: java_second_order_sqli
language: java
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: 'Second-Order SQL Injection: ResultSet value concatenated into a subsequent
  SQL query string'
message: |-
  A value retrieved from a database ResultSet via rs.getString() is concatenated directly into a new SQL query string. An attacker who previously stored a SQL injection payload in the database can trigger it when the stored value is re-used in this second-order query. First-order defenses (escaping at input time) do not protect against second-order injection.
sources:
- rs.getString(
- entity.get
- row.get(
- result.get(
sinks:
- '"SELECT.*" + rs.getString'
- '"UPDATE.*" + entity.get'
- session.createQuery(".*" + row
sanitizers:
- setParameter(
- preparedStatement
remediation: |-
  Parameterize ALL SQL queries. Database-retrieved values are as untrusted as user input.

  UNSAFE:
    String username = rs.getString("username");
    stmt.executeQuery("SELECT * FROM logs WHERE user = '" + username + "'");

  SAFE:
    String username = rs.getString("username");
    PreparedStatement ps = conn.prepareStatement("SELECT * FROM logs WHERE user = ?");
    ps.setString(1, username);
    ps.executeQuery();

  See OWASP SQL Injection Prevention Cheat Sheet for second-order injection defense patterns.
