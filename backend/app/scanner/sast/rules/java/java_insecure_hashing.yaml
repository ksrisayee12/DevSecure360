rule_id: java_insecure_hashing
language: java
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Insecure Hashing Algorithm (CWE-328)
message: |-
  The application uses a broken or weak cryptographic hashing algorithm such as MD5 or SHA1. These algorithms are vulnerable to collision attacks.
sources: []
sinks:
- MessageDigest.getInstance("MD5")
- MessageDigest.getInstance("SHA-1")
- MessageDigest.getInstance("SHA1")
- DigestUtils.md5Hex(
sanitizers: []
remediation: |-
  Use strong hashing algorithms like SHA-256, SHA-3, or Argon2/bcrypt for passwords.

  UNSAFE:
    MessageDigest md = MessageDigest.getInstance("MD5");

  SAFE:
    MessageDigest md = MessageDigest.getInstance("SHA-256");
