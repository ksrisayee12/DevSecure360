rule_id: java_sqli_jpa_native
language: java
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via JPA EntityManager.createNativeQuery() with string concatenation
message: |-
  User-controlled input is concatenated directly into a native SQL query string passed to EntityManager.createNativeQuery(). Native queries bypass the JPA abstraction layer entirely. An attacker can inject arbitrary SQL to read, modify, or delete any data the database account has access to, including tables outside the application's normal data scope.
sources:
- request.getParameter(
- request.getHeader(
- request.getQueryString(
- request.getInputStream(
- request.getCookies(
- request.getReader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- entityManager.createNativeQuery(
- em.createNativeQuery(
sanitizers:
- setParameter(
- setString(
remediation: |-
  Use named parameters (:param) with createNativeQuery and setParameter instead of string concat.

  UNSAFE:
    entityManager.createNativeQuery("SELECT * FROM orders WHERE id = " + id);

  SAFE:
    entityManager.createNativeQuery("SELECT * FROM orders WHERE id = :id")
        .setParameter("id", id).getResultList();

  Prefer createQuery() with JPQL for type-safe ORM queries. See OWASP SQL Injection Prevention Cheat Sheet.
