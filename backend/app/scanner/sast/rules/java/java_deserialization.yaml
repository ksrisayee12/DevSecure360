remediation: |-
  Do not use Java native serialization (ObjectInputStream) for untrusted data. Use safer formats like JSON (Jackson/Gson) without polymorphic type handling enabled, or use ValidatingObjectInputStream.

  UNSAFE:
    Object obj = new ObjectInputStream(inputStream).readObject();

  SAFE:
    // Use JSON parsing with strict class types
