rule_id: java_weak_crypto_ecb
language: java
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Weak Crypto via AES cipher in ECB mode — deterministic encryption leaks plaintext
  patterns
message: |-
  The application uses AES in ECB mode via Cipher.getInstance("AES/ECB") or Cipher.getInstance("AES") (which defaults to ECB in the JCE provider). ECB encrypts identical plaintext blocks to identical ciphertext blocks, revealing data patterns even without the key. Attackers can perform pattern analysis and replay attacks on AES/ECB ciphertext.
sources: []
sinks:
- Cipher.getInstance("AES/ECB
- Cipher.getInstance("AES"
sanitizers:
- Cipher.getInstance("AES/GCM
- Cipher.getInstance("AES/CBC
remediation: |-
  Replace AES/ECB with AES/GCM for authenticated encryption with a random IV per operation.

  UNSAFE:
    Cipher c = Cipher.getInstance("AES/ECB/PKCS5Padding");

  SAFE:
    byte[] iv = new byte[12];
    new SecureRandom().nextBytes(iv);
    Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
    c.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));

  AES/GCM provides both confidentiality and authentication. See OWASP Cryptographic Storage Cheat Sheet.
