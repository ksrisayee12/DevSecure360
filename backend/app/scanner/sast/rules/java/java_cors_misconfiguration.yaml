rule_id: java_cors_misconfiguration
language: java
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.4
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Permissive Cross-Origin Resource Sharing (CORS)
message: |-
  The application configures CORS to allow requests from any origin ('*'), potentially exposing sensitive data to malicious sites.
sources: []
sinks:
- '@CrossOrigin(origins = "*")'
- setAllowedOrigins(Arrays.asList("*"))
sanitizers: []
remediation: |-
  Configure CORS to only allow trusted domains.

  UNSAFE:
    @CrossOrigin(origins = "*")

  SAFE:
    @CrossOrigin(origins = "https://trusted.example.com")
