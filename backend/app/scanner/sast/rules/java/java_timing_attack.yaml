rule_id: java_timing_attack
language: java
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-208
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: 'Timing attack: non-constant-time comparison with String.equals() or Arrays.equals()
  for HMAC'
message: |-
  The application uses String.equals() or Arrays.equals() to compare HMAC digests, API tokens, or password reset tokens. Both methods terminate early on the first mismatch, leaking timing information proportional to the number of matching bytes. Attackers can exploit this to forge tokens through remote timing analysis over large numbers of HTTP requests.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- Arrays.equals(mac
- .equals(expectedToken
- String.equals(digest
sanitizers:
- MessageDigest.isEqual(
- HmacUtils.hmacSha256Hex(
remediation: |-
  Use MessageDigest.isEqual() for constant-time comparison of all cryptographic byte arrays.

  UNSAFE:
    if (Arrays.equals(computedMac, providedMac)) { /* timing leak */ }
    if (token.equals(expectedToken)) { /* timing leak */ }

  SAFE:
    import java.security.MessageDigest;
    if (MessageDigest.isEqual(computedMac, providedMac)) { /* constant-time */ }

  MessageDigest.isEqual() was introduced in Java 6 and is constant-time. See OWASP Cryptographic Storage Cheat Sheet.
