rule_id: java_dos_zip_bomb
language: java
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via ZipInputStream
message: |-
  Decompressing entries from a ZipInputStream in a loop without tracking the cumulative byte count allows Zip Bomb attacks to exhaust disk and memory resources.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- new ZipInputStream(
- zis.getNextEntry()
sanitizers:
- totalBytes > MAX_SIZE
remediation: |-
  Keep a running total of bytes written during extraction. Throw an exception and abort if the total exceeds a predefined safe limit. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
