rule_id: java_cmdi_processbuilder
language: java
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via ProcessBuilder with user-controlled command elements
message: |-
  User-supplied input is passed as an argument to ProcessBuilder(), which executes a process. If the first argument is a shell interpreter (sh, bash, cmd) or if user input controls the command name itself, an attacker can execute arbitrary OS commands with the web server process privileges, potentially leading to full server compromise.
sources:
- request.getParameter(
- request.getHeader(
- request.getQueryString(
- request.getInputStream(
- request.getCookies(
- request.getReader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- new ProcessBuilder(
- ProcessBuilder(
sanitizers:
- shlex.quote(
remediation: |-
  Never pass user input directly as ProcessBuilder command elements. Use an allowlist.

  UNSAFE:
    new ProcessBuilder(userInput).start();
    new ProcessBuilder("sh", "-c", userInput).start();

  SAFE:
    List<String> allowed = Arrays.asList("ls", "pwd");
    if (!allowed.contains(userInput)) throw new SecurityException();
    new ProcessBuilder(userInput).start();

  Avoid shell invocation with user-controlled args entirely. See OWASP OS Command Injection Defense Cheat Sheet.
