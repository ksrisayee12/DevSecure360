rule_id: java_el_injection
language: java
vuln_class: Code Injection
severity: Critical
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Code Injection via Spring EL (SpEL) expression evaluation with user-controlled
  input
message: |-
  User-supplied input is passed to Spring Expression Language evaluation via ExpressionParser.parseExpression() or @Value annotation with external data. SpEL can access any Java class through reflection. An attacker can inject a SpEL expression like T(java.lang.Runtime).getRuntime().exec('id') to execute arbitrary OS commands.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- parser.parseExpression(
- new SpelExpressionParser()
- StandardEvaluationContext
sanitizers:
- SimpleEvaluationContext
- setPropertyAccessors(
remediation: |-
  Use SimpleEvaluationContext with a restricted property accessor instead of StandardEvaluationContext.

  UNSAFE:
    ExpressionParser parser = new SpelExpressionParser();
    Expression expr = parser.parseExpression(userInput);
    Object result = expr.getValue();

  SAFE:
    SimpleEvaluationContext ctx = SimpleEvaluationContext
        .forReadOnlyDataBinding().build();
    Expression expr = parser.parseExpression("#this.name");
    // userInput is passed as data, not as expression

  Never evaluate user-controlled strings as SpEL expressions. See CVE-2018-1270 (Spring Messaging RCE).
