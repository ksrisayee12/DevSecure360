rule_id: java_mass_assignment_spring
language: java
vuln_class: Mass Assignment
severity: High
cwe: CWE-915
owasp: A08:2021-Software and Data Integrity Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: Mass Assignment via Spring MVC Model Binding
message: |-
  Binding an HTTP request directly to JPA Entity classes (e.g., @ModelAttribute or @RequestBody User user) allows an attacker to manipulate sensitive fields like roles or permissions.
sources:
- '@RequestBody User'
- '@ModelAttribute User'
sinks:
- save(
- update(
sanitizers:
- DTO
remediation: |-
  Create specific Data Transfer Objects (DTOs) for API inputs that only include the fields the user is allowed to update, rather than using Entity classes directly. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
