# Verification:    DriverManager.getConnection with literal string arguments for username/password is a common hardcoded credential sink.

rule_id: java_hardcoded_credentials
language: java
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Hardcoded Secret or Credential
message: |-
  The application contains hardcoded secrets (API keys, passwords, database credentials) in the source code. If the code is leaked or accessed by unauthorized individuals, the secrets can be extracted and abused.
sources: []
sinks:
- DriverManager.getConnection( "jdbc:mysql://
- DriverManager.getConnection("jdbc:postgresql://
- DriverManager.getConnection("jdbc:oracle://
sanitizers: []
remediation: |-
  Remove hardcoded secrets from source code. Load credentials dynamically from environment variables, configuration files securely provisioned at runtime, or a secrets management system.

  UNSAFE:
    Connection conn = DriverManager.getConnection(DB_URL, "admin", "SuperSecretPassword");

  SAFE:
    Connection conn = DriverManager.getConnection(DB_URL, System.getenv("DB_USER"), System.getenv("DB_PASS"));
