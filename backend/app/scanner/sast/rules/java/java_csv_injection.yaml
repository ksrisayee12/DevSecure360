# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/1236.html
# CodeQL Source:   Not applicable — pattern-based formula character detection
# Semgrep Source:  https://semgrep.dev/r?q=csv+injection
# OWASP Cheat:     https://owasp.org/www-community/attacks/CSV_Injection
# Verification:    CSV formula injection (=,+,@,-) detected as pattern-based code injection. Rule is Tentative.

rule_id: java_csv_injection
language: java
vuln_class: Code Injection
severity: High
cwe: CWE-1236
owasp: A03:2021-Injection
cvss_score: 7.8
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H
confidence: Tentative
issue: 'CSV Formula Injection: user data with formula prefix written to CSV without
  sanitization'
message: |-
  User-supplied data starting with = + @ - | characters is written to CSV output via Apache Commons CSV, OpenCSV, or similar without formula injection protection. When the exported file is opened in Excel or Google Sheets, the cell is interpreted as a formula, enabling exfiltration via =WEBSERVICE() or DDE-based macro execution.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- csvPrinter.printRecord(
- csvWriter.writeNext(
- new CSVPrinter(
sanitizers:
- sanitizeCsvValue(
remediation: |-
  Sanitize all user values before writing to CSV output by escaping formula trigger characters.

  UNSAFE:
    csvPrinter.printRecord(userName, userEmail);

  SAFE:
    static String sanitizeCsv(String val) {
        if (val != null && val.matches("^[=+@\\-|%].*"))
            return "'" + val;
        return val;
    }
    csvPrinter.printRecord(sanitizeCsv(userName), sanitizeCsv(userEmail));

  See OWASP CSV Injection guide and MITRE CWE-1236 for complete defense guidance.
