rule_id: java_dos_billion_laughs
language: java
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via XML Entity Expansion (Billion Laughs)
message: |-
  Parsing untrusted XML with DocumentBuilderFactory without enabling the SECURE_PROCESSING feature allows unbounded entity expansion, leading to DoS.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- factory.newDocumentBuilder(
sanitizers:
- FEATURE_SECURE_PROCESSING
remediation: |-
  Set the `XMLConstants.FEATURE_SECURE_PROCESSING` feature to true on the DocumentBuilderFactory to prevent entity expansion attacks. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
