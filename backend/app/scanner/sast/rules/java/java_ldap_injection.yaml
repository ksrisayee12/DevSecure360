cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: LDAP Injection via unescaped string concatenation in InitialDirContext.search()
message: |-
  Constructing LDAP filters dynamically with user input allows an attacker to alter the query logic, bypassing authentication or accessing unauthorized directory information.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- 'ctx.search(base, "(uid=" + '
sanitizers:
- search(base, filterExpr, filterArgs
remediation: |-
  Use parameterized LDAP queries or properly escape user input using an established library.

  SAFE:
    ctx.search(base, "(uid={0})", new Object[]{userInput}, controls); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
