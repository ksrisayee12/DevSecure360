remediation: |-
  Avoid nested quantifiers like (a+)+ or overlapping alternatives like (a|a)+ in regular expressions.

  UNSAFE:
    Pattern.compile("^(a+)+$");

  SAFE:
    // Use a simpler, non-backtracking regex
