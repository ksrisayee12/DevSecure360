sanitizers: []
remediation: |-
  Use parameterized queries or explicit object mapping instead of raw JSON queries.

  UNSAFE:
    mongoTemplate.find(new BasicQuery("{'user': '" + input + "'}"), User.class);

  SAFE:
    mongoTemplate.find(Query.query(Criteria.where("user").is(input)), User.class);
