rule_id: java_unsafe_reflection_method_invoke
language: java
vuln_class: Code Injection
severity: Critical
cwe: CWE-470
owasp: A08:2021-Software and Data Integrity Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Unsafe Reflection via Method.invoke()
message: |-
  Allowing an attacker to control the method name and parameters invoked reflectively via Method.invoke() can lead to unauthorized function execution and RCE.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- Method.invoke(
