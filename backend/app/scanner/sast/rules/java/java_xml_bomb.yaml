# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/776.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/java/semmle/code/java/security/XXE.qll
# Semgrep Source:  https://semgrep.dev/r/java.lang.security.audit.xxe.documentbuilderfactory-disallow-doctype-decl
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
# Verification:    Failing to set FEATURE_SECURE_PROCESSING on DocumentBuilderFactory allows XML bombs.

rule_id: java_xml_bomb
language: java
vuln_class: DoS
severity: High
cwe: CWE-776
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Tentative
issue: XML Entity Expansion / Billion Laughs (CWE-776)
message: |-
  The application configures an XML parser without setting FEATURE_SECURE_PROCESSING, making it vulnerable to XML Bomb (Billion Laughs) DoS attacks.
sources: []
sinks:
- DocumentBuilderFactory.newInstance()
- SAXParserFactory.newInstance()
sanitizers:
- XMLConstants.FEATURE_SECURE_PROCESSING
remediation: |-
  Explicitly enable XMLConstants.FEATURE_SECURE_PROCESSING to prevent entity expansion attacks and XXE.

  UNSAFE:
    DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();

  SAFE:
    DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();
    dbf.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
