rule_id: java_tls_trust_all_manager
language: java
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: Trusting all certificates'
message: |-
  Implementing an X509TrustManager that has empty checkClientTrusted and checkServerTrusted methods accepts all SSL certificates, completely breaking TLS security.
sources: []
sinks:
- implements X509TrustManager
- checkClientTrusted
- checkServerTrusted
sanitizers:
- return false
remediation: |-
  Do not use TrustAll managers. Ensure the TrustManager performs strict cryptographic verification of the certificate chain. Always review your code and apply strict validation. Consult secure coding best practices.
