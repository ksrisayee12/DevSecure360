rule_id: java_runtime_exec
language: java
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via Runtime.getRuntime().exec() with unvalidated user input
message: |-
  Passing a user-controlled string to Runtime.exec() can lead to command injection if the string is parsed by a shell. Even without a shell, argument injection is possible.
sources:
- request.getParameter(
- request.getHeader(
- '@RequestParam'
- '@PathVariable'
- '@RequestBody'
sinks:
- Runtime.getRuntime().exec(
sanitizers:
- ProcessBuilder
remediation: |-
  Use ProcessBuilder and pass arguments as a List of strings, avoiding shell invocation.

  SAFE:
    ProcessBuilder pb = new ProcessBuilder("ping", userInput);
    pb.start(); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
