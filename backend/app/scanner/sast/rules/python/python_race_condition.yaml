# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/367.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/python/semmle/python/security/dataflow/RaceCondition.qll
# Semgrep Source:  https://semgrep.dev/r/python.lang.security.audit.os.path.exists.race-condition
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
# Verification:    os.path.exists() followed by open() is a classic TOCTOU race condition in file systems.

rule_id: python_race_condition
language: python
vuln_class: Race Condition
severity: Medium
cwe: CWE-367
owasp: A01:2021-Broken Access Control
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:N
confidence: Tentative
issue: Time-of-check Time-of-use (TOCTOU) Race Condition (CWE-367)
message: |-
  The application checks for the existence of a file before operating on it. An attacker can replace the file between the check and the use.
sources:
- os.path.exists(
sinks:
- open(
- os.remove(
sanitizers: []
remediation: |-
  Do not check for file existence before opening it. Instead, attempt the operation (e.g., open) and handle the resulting exceptions (EAFP principle).

  UNSAFE:
    if os.path.exists(path):
        f = open(path, 'r')

  SAFE:
    try:
        f = open(path, 'r')
    except FileNotFoundError:
        pass
