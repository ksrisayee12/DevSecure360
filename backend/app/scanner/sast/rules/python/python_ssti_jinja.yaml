remediation: |-
  Never pass user input into functions that evaluate template strings (like render_template_string). Always pass user data as context variables to static template files.

  UNSAFE:
    return render_template_string('Hello ' + user_input)

  SAFE:
    return render_template('hello.html', name=user_input)
