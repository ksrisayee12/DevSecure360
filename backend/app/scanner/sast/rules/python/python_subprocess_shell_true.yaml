# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/78.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=command+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
# Verification:    OS command execution with shell=True or direct string passing allows RCE.

rule_id: python_subprocess_shell_true
language: python
vuln_class: CMDi
severity: Critical
cwe: CWE-78
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Command Injection via subprocess with shell=True and user input
message: |-
  Using subprocess.call(), check_output(), or Popen() with shell=True and a formatted string containing user input enables OS command injection.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- subprocess.Popen(
- subprocess.call(
- shell=True
sanitizers:
- shlex.quote(
- shell=False
remediation: |-
  Never use shell=True with user input. Pass arguments as a list with shell=False.

  UNSAFE:
    subprocess.call(f"ping {user_ip}", shell=True)

  SAFE:
    subprocess.call(["ping", user_ip]) Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
