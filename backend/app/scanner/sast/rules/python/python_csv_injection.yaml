# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/1236.html
# CodeQL Source:   Not applicable — pattern-based formula character detection
# Semgrep Source:  https://semgrep.dev/r?q=csv+injection
# OWASP Cheat:     https://owasp.org/www-community/attacks/CSV_Injection
# Verification:    CSV formula injection (=,+,@,-) detected as pattern-based code injection. Rule is Tentative.

rule_id: python_csv_injection
language: python
vuln_class: Code Injection
severity: High
cwe: CWE-1236
owasp: A03:2021-Injection
cvss_score: 7.8
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H
confidence: Tentative
issue: 'CSV Formula Injection: user data with =,+,@,- prefix written to CSV without
  sanitization'
message: |-
  User-supplied data containing leading formula characters (=, +, @, -, |) is written to a CSV file via csv.writer without sanitization. When the victim opens the exported CSV in Microsoft Excel or Google Sheets, the cell is executed as a formula. Attackers can embed =HYPERLINK() calls to exfiltrate data to external servers or =WEBSERVICE() to make HTTP requests.
sources:
- request.args
- request.form
- request.data
- request.json
- request.files
sinks:
- csv.writer(
- csvwriter.writerow(
- to_csv(
sanitizers:
- sanitize_csv(
remediation: |-
  Sanitize all values before writing to CSV by escaping leading formula characters.

  UNSAFE:
    writer.writerow([user_name, user_email])

  SAFE:
    def sanitize_csv(val):
        val = str(val)
        if val and val[0] in ('=', '+', '-', '@', '|', '%'):
            val = "'" + val  # prepend quote to force text
        return val
    writer.writerow([sanitize_csv(user_name), sanitize_csv(user_email)])

  See OWASP CSV Injection defense and MITRE CWE-1236 for complete guidance.
