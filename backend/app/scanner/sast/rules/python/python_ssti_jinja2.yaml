# Verification:    Passing user input directly as a template string leads to Template Injection (SSTI).

rule_id: python_ssti_jinja2
language: python
vuln_class: Code Injection
severity: Critical
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Server-Side Template Injection (SSTI) in Jinja2
message: |-
  Passing user input directly as a template string to Jinja2's Template() constructor allows attackers to execute arbitrary Python code via SSTI payloads (e.g., {{config.__class__}}).
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- Template(
- render_template_string(
sanitizers:
- render_template(
remediation: |-
  Never build Jinja templates dynamically with user input. Use static template files and pass input securely via context variables (e.g., render_template). Always ensure input validation and consult language-specific security documentation.
