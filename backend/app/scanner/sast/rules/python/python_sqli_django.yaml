remediation: |-
  Use Django ORM's standard queryset filtering methods. If raw SQL is unavoidable, always pass user input via the `params` argument.

  UNSAFE:
    User.objects.raw(f'SELECT * FROM auth_user WHERE username="{username}"')

  SAFE:
    User.objects.raw('SELECT * FROM auth_user WHERE username=%s', [username])
