remediation: |-
  Avoid os.system(). Use the subprocess module with shell=False and pass arguments as a list.

  UNSAFE:
    os.system(f'ping -c 1 {ip}')

  SAFE:
    subprocess.run(['ping', '-c', '1', ip])
