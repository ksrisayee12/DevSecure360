rule_id: python_open_redirect_flask
language: python
vuln_class: Open Redirect
severity: Medium
cwe: CWE-601
owasp: A01:2021-Broken Access Control
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Open Redirect via flask.redirect()
message: |-
  Passing user input directly to flask.redirect() or django.shortcuts.redirect() allows attackers to redirect users to malicious websites.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- redirect(
sanitizers:
- urlparse(
remediation: |-
  Ensure the URL is a safe, relative path. In Flask/Django, validate that the scheme and netloc are empty before redirecting. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
