rule_id: python_paramiko_no_host_verify
language: python
vuln_class: Cleartext Transmission
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.4
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Paramiko SSH client configured with AutoAddPolicy — disabling host key verification
  enables MITM
message: |-
  The Paramiko SSH client is configured with client.set_missing_host_key_policy(AutoAddPolicy()) or WarningPolicy(). AutoAddPolicy automatically accepts and trusts any host key on first connection without verification. An attacker performing a man-in-the-middle attack can present a fake host key and intercept the entire SSH session including credentials.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- AutoAddPolicy()
- set_missing_host_key_policy(AutoAddPolicy
- WarningPolicy()
sanitizers:
- RejectPolicy()
- load_host_keys(
remediation: |-
  Use RejectPolicy (default) and load known host keys from a trusted file.

  UNSAFE:
    client = paramiko.SSHClient()
    client.set_missing_host_key_policy(paramiko.AutoAddPolicy())  /* MITM risk */

  SAFE:
    client = paramiko.SSHClient()
    client.load_system_host_keys()  /* use ~/.ssh/known_hosts */
    # Default RejectPolicy raises error for unknown hosts
    client.connect(hostname, username=user, key_filename=key)

  Alternatively pre-populate known_hosts from a trusted source before connecting. See Paramiko documentation and OWASP Transport Layer Protection Cheat Sheet.
