rule_id: python_cleartext_transmission
language: python
vuln_class: Cleartext Transmission
severity: High
cwe: CWE-319
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.4
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Cleartext Transmission of Sensitive Information (CWE-319)
message: |-
  The application transmits data in cleartext using HTTP or FTP instead of secure protocols (HTTPS/SFTP). This exposes data to man-in-the-middle (MITM) attacks.
sources: []
sinks:
- requests.get("http://
- requests.post("http://
- urllib.request.urlopen("http://
sanitizers: []
remediation: |-
  Use secure transport protocols like HTTPS for all network communications.

  UNSAFE:
    requests.get("http://api.example.com/data")

  SAFE:
    requests.get("https://api.example.com/data")
