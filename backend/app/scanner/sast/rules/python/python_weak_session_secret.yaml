rule_id: python_weak_session_secret
language: python
vuln_class: Misconfiguration
severity: High
cwe: CWE-16
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Flask application using a weak or hardcoded SECRET_KEY for session cookie signing
message: |-
  The Flask application uses a hardcoded or weak SECRET_KEY (such as "dev", "secret", or an empty string) for signing session cookies. An attacker who can guess or brute-force this key can forge valid session cookies for any user account including administrators, achieving complete authentication bypass without requiring credentials.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Use a cryptographically random SECRET_KEY loaded from an environment variable or secrets manager at runtime.

  UNSAFE:
    app.config["SECRET_KEY"] = "dev"
    app.config["SECRET_KEY"] = "secret123"

  SAFE:
    import os
    app.config["SECRET_KEY"] = os.environ["SECRET_KEY"]
    # Generate with: python -c "import secrets; print(secrets.token_hex(32))"

  Rotate the key immediately if it was ever exposed. Use a secrets manager in production.
