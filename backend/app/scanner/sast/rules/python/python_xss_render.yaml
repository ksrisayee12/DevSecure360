remediation: |-
  Never pass user-controlled input directly into render_template_string or wrap it in Markup() without sanitization. Use standard template rendering with autoescape enabled.

  UNSAFE:
    return render_template_string('<h1>Hello ' + request.args.get('name') + '</h1>')

  SAFE:
    return render_template('hello.html', name=request.args.get('name'))
