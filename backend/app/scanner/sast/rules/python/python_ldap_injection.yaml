# Verification:    User input in LDAP queries without escaping enables auth bypass.

rule_id: python_ldap_injection
language: python
vuln_class: LDAP Injection
severity: Critical
cwe: CWE-90
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: LDAP Injection via unescaped string formatting in LDAP search filter
message: |-
  Constructing an LDAP filter string dynamically with user input allows an attacker to alter the query logic, bypassing authentication or accessing unauthorized directory information.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- ldap_conn.search_s(base, scope, f"(uid={
- ldap_conn.search(
sanitizers:
- ldap3.utils.conv.escape_filter_chars(
remediation: |-
  Use the appropriate escaping function (e.g., ldap3.utils.conv.escape_filter_chars) on all user input embedded in LDAP filters. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
