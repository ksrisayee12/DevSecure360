confidence: Tentative
issue: 'CORS Misconfiguration: Flask-CORS wildcard'
message: |-
  Configuring CORS(app, resources={r"/*": {"origins": "*"}}) allows any origin to interact with the API, which can leak sensitive data to malicious domains.
sources: []
sinks:
- 'origins": "*"'
- origins='*'
sanitizers:
- origins_list
remediation: |-
  Specify a precise list of trusted origins for the CORS configuration. Always review your code and apply strict validation. Consult secure coding best practices.
