rule_id: python_dos_billion_laughs_xml
language: python
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via XML Entity Expansion (Billion Laughs)
message: |-
  Parsing untrusted XML using the standard `xml.etree.ElementTree` without protections allows Billion Laughs attacks to exhaust server memory.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- ET.parse(
- ET.fromstring(
sanitizers:
- defusedxml
remediation: |-
  Use the `defusedxml` package instead of the standard library `xml` module when parsing untrusted XML. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
