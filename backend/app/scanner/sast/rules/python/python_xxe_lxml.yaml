# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/611.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=xxe
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
# Verification:    XML parsers processing untrusted data without disabling DTDs allow XXE attacks.

rule_id: python_xxe_lxml
language: python
vuln_class: XXE
severity: High
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: XXE via lxml XMLParser with resolve_entities=True
message: |-
  Configuring the lxml XMLParser with resolve_entities=True allows the processing of external entities, exposing the application to XXE attacks when parsing untrusted data.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- lxml.etree.XMLParser(
- resolve_entities=True
sanitizers:
- resolve_entities=False
remediation: |-
  Instantiate lxml's XMLParser with resolve_entities=False to prevent external entity processing. Always ensure input validation and consult language-specific security documentation.
