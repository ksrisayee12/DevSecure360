rule_id: python_random_secret_key
language: python
vuln_class: Weak Crypto
severity: High
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Weak randomness via random.random() or random.choice() used to generate Flask
  secret key or token
message: |-
  The application uses Python's random module (random.random(), random.choice(), random.randint()) to generate a Flask SECRET_KEY, session token, password reset token, or CSRF nonce. The random module uses a Mersenne Twister PRNG that is not cryptographically secure. An attacker can predict future output after observing a sufficient number of values.
sources: []
sinks:
- random.random()
- random.choice(
- random.randint(
- random.randbytes(
sanitizers:
- secrets.token_hex(
- os.urandom(
remediation: |-
  Use the secrets module or os.urandom() for all security-sensitive random generation.

  UNSAFE:
    import random, string
    token = ''.join(random.choices(string.ascii_letters, k=32))  /* predictable */

  SAFE:
    import secrets
    token = secrets.token_hex(32)      # URL-safe hex token
    token = secrets.token_urlsafe(32)  # URL-safe base64 token

  For Flask: app.secret_key = secrets.token_hex(32) See Python secrets module documentation and OWASP Cryptographic Storage Cheat Sheet.
