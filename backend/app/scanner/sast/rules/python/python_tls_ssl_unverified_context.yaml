rule_id: python_tls_ssl_unverified_context
language: python
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: ssl._create_unverified_context'
message: |-
  Using ssl._create_unverified_context() globally disables certificate verification for urllib, undermining the security of all HTTPS requests in the application.
sources: []
sinks:
- ssl._create_unverified_context(
sanitizers:
- ssl.create_default_context(
remediation: |-
  Use ssl.create_default_context() which validates certificates against the system's trusted CAs. Always review your code and apply strict validation. Consult secure coding best practices.
