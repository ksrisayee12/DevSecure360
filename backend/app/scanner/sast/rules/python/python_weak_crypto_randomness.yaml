# Verification:    The 'random' module is explicitly documented by Python as insecure for cryptographic purposes.

rule_id: python_weak_crypto_randomness
language: python
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via random module
message: |-
  The application uses a cryptographically weak pseudo-random number generator (PRNG) from the standard 'random' module. If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- random.randint(
- random.choice(
- random.random(
- random.randrange(
- random.getrandbits(
sanitizers: []
remediation: |-
  Use the 'secrets' module for generating cryptographically strong random numbers suitable for managing data such as passwords, account authentication, security tokens, and related secrets.

  UNSAFE:
    token = random.randint(100000, 999999)

  SAFE:
    import secrets
    token = secrets.randbelow(900000) + 100000
