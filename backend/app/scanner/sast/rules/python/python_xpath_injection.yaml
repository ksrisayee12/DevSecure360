remediation: |-
  Avoid string concatenation when building XPath queries. Parameterize XPath queries using libraries that support variables (like lxml with dicts of variables).

  UNSAFE:
    tree.xpath(f"//user[name/text()='{username}']")

  SAFE:
    tree.xpath("//user[name/text()=$username]", username=username)
