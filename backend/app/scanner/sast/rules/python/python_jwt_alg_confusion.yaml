# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/287.html
# CodeQL Source:   Not applicable — pattern-based JWT decode detection
# Semgrep Source:  https://semgrep.dev/r?q=jwt+algorithm+confusion
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
# Verification:    JWT RS256→HS256 key confusion attack pattern verified from PortSwigger JWT research.

rule_id: python_jwt_alg_confusion
language: python
vuln_class: JWT Bypass
severity: Critical
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 9.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: 'JWT Algorithm Confusion: decoding JWT without specifying allowed algorithms
  enables RS256→HS256 attack'
message: |-
  The application decodes a JWT using PyJWT's jwt.decode() without specifying the algorithms parameter, or specifying algorithms=['RS256', 'HS256'] together. An attacker can forge a JWT signed with the server's RSA public key using HMAC-SHA256, then submit it as a valid RS256 token. The server, treating the public key as an HMAC secret, verifies it successfully.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- jwt.decode(
- JWT.decode(
- decode(token, key
sanitizers:
- algorithms=['RS256']
- algorithms=['HS256']
remediation: |-
  Always specify exactly one algorithm in jwt.decode() and never mix asymmetric and symmetric.

  UNSAFE:
    jwt.decode(token, public_key)  /* no algorithms — accepts any */
    jwt.decode(token, key, algorithms=['RS256', 'HS256'])  /* confusion risk */

  SAFE:
    # RS256 only — asymmetric
    jwt.decode(token, public_key, algorithms=['RS256'])

    # HS256 only — symmetric
    jwt.decode(token, secret, algorithms=['HS256'])

  See PortSwigger JWT algorithm confusion research and PyJWT security documentation.
