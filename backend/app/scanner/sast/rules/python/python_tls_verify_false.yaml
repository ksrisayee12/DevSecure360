# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=certificate+validation
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
# Verification:    Disabling TLS certificate validation allows Man-in-the-Middle (MitM) attacks. Tentative.

rule_id: python_tls_verify_false
language: python
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: requests verify=False'
message: |-
  Passing verify=False to requests.get() or requests.post() disables SSL/TLS certificate verification, permitting MitM attacks on the connection.
sources: []
sinks:
- verify=False
- verify=0
sanitizers:
- verify=True
remediation: |-
  Ensure verify=True is used (or omitted, as it is the default). If using custom certificates, pass the path to the CA bundle instead of disabling verification. Always review your code and apply strict validation. Consult secure coding best practices.
