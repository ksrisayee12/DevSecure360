remediation: |-
  Validate the redirect URL against an allowlist, or ensure it is a relative path rather than an absolute URL to an external domain.

  UNSAFE:
    return redirect(request.args.get('next'))

  SAFE:
    next_url = request.args.get('next')
    if next_url.startswith('/') and not next_url.startswith('//'):
        return redirect(next_url)
