remediation: |-
  Sanitize user input before logging it, particularly by stripping newline characters (CR/LF) and encoding special characters, or use structured logging (JSON) to separate data from log metadata.

  UNSAFE:
    logging.info('User failed login: ' + username)

  SAFE:
    logging.info('User failed login: %s', username.replace('\n', ''))
