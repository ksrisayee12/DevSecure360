# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/22.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=path+traversal
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
# Verification:    Directory traversal in file delete/upload functions allows destructive actions or RCE.

rule_id: python_path_traversal_os_remove
language: python
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H
confidence: Confirmed
issue: Arbitrary File Deletion via os.remove() or os.unlink()
message: |-
  Using unvalidated user input to specify a path for os.remove() allows a directory traversal attack that can delete sensitive files.
sources:
- request.args
- request.form
- request.data
- request.json
- request.GET
- request.POST
sinks:
- os.remove(
- os.unlink(
sanitizers:
- os.path.basename(
remediation: |-
  Strip directory segments using os.path.basename() or secure_filename() and ensure the target file resides strictly in the allowed upload/storage directory. Always ensure input validation and consult language-specific security documentation.
