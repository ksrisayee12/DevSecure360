rule_id: python_missing_xcontent_type
language: python
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing X-Content-Type-Options header in Flask/Django response enables MIME
  sniffing
message: |-
  The application does not set the X-Content-Type-Options: nosniff header, allowing browsers to MIME-sniff response content types. An attacker who controls uploaded file content could cause the browser to interpret a resource served as text/plain as executable JavaScript, enabling script injection despite a safe declared MIME type.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set X-Content-Type-Options: nosniff on all responses to disable browser MIME sniffing.

  UNSAFE (Flask): No X-Content-Type-Options header.
  SAFE:
    @app.after_request
    def add_xcto(response):
        response.headers["X-Content-Type-Options"] = "nosniff"
        return response

  Consider Flask-Talisman for declarative management of all security response headers.
