remediation: |-
  Replace string concatenation or formatting in SQL queries with parameterized queries. The database driver handles all escaping automatically and the query structure cannot be altered by user input.

  UNSAFE:
    query = "SELECT * FROM users WHERE name='" + username + "'"
    cursor.execute(query)

  SAFE (psycopg2 / MySQLdb):
    cursor.execute("SELECT * FROM users WHERE name=%s", (username,))

  Never build SQL strings from user input under any circumstances.
