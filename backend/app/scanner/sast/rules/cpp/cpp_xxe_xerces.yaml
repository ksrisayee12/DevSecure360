rule_id: cpp_xxe_xerces
language: cpp
vuln_class: XXE
severity: High
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: XXE via Apache Xerces-C++
message: |-
  Parsing untrusted XML with Xerces-C++ without disabling DTDs or external entities allows attackers to read arbitrary files via XXE attacks.
sources: []
sinks:
- parser->parse(
sanitizers:
- setDisableDefaultEntityResolution(true)
remediation: |-
  Configure the Xerces parser to ignore external DTDs and disable entity resolution before parsing untrusted XML data. Always ensure input validation and consult language-specific security documentation.
