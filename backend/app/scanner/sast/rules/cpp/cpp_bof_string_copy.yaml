issue: Buffer Overflow via std::string::copy
message: |-
  The application uses std::string::copy() to write data into a raw character buffer without explicit validation that the destination buffer is large enough.
sources:
- std::cin
- std::getline
- getenv
- read
- recv
- ifstream
- istream
- stringstream
