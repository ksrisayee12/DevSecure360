rule_id: cpp_format_string
language: cpp
vuln_class: Format String
severity: High
cwe: CWE-134
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Format String Vulnerability via printf family
message: |-
  User input is passed directly as the format string argument to a printf-family function in C++.
sources:
- gets(
- fgets(
- scanf(
- fscanf(
- sscanf(
- read(
- recv(
- recvfrom(
- getenv(
- argv[
sinks:
- printf(
- fprintf(
- sprintf(
- snprintf(
- syslog(
- err(
- warn(
sanitizers:
- std::cout <<
remediation: |-
  Never pass user input as the format string. Always use a static format string, or use C++ streams (std::cout) which are not vulnerable to format string attacks.

  UNSAFE:
    printf(argv[1]);

  SAFE:
    std::cout << argv[1];
