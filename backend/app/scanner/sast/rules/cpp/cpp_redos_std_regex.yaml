rule_id: cpp_redos_std_regex
language: cpp
vuln_class: ReDoS
severity: Medium
cwe: CWE-1333
owasp: A01:2021-Broken Access Control
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
confidence: Tentative
issue: ReDoS via std::regex_match or std::regex_search
message: |-
  The C++ std::regex engine uses backtracking and is susceptible to ReDoS when executing complex patterns against maliciously crafted user input.
sources: []
sinks:
- std::regex_match(
- std::regex_search(
sanitizers:
- RE2
remediation: |-
  Avoid complex regular expressions with nested quantifiers. Consider using Google's RE2 library which provides linear-time guarantees and prevents ReDoS. Always ensure input validation and consult language-specific security documentation.
