# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/798.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=hardcoded+secret
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
# Verification:    Hardcoded credentials/tokens in source verified from CodeQL and Semgrep secret detection registries.

rule_id: cpp_hardcoded_secret
language: cpp
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded credential or API key string literal in C++ source code
message: |-
  A password, API token, or cryptographic key is embedded as a string literal in C++ source. The credential appears in compiled binaries, stack traces, and version control history. Automated secret scanning tools routinely discover such leaks. The credential cannot be rotated without recompiling, creating operational risk during incident response.
sources: []
sinks:
- password = "
- api_key = "
- secret = "
- token = "
- private_key = "
sanitizers:
- getenv(
- std::getenv(
remediation: |-
  Store secrets in environment variables or a secrets management system. Never in source code.

  UNSAFE:
    std::string db_password = "s3cur3P@ssw0rd!";

  SAFE:
    const char *db_password = std::getenv("DB_PASSWORD");
    if (!db_password) throw std::runtime_error("DB_PASSWORD not configured");

  Rotate any secret that has been committed to version control immediately. Use git-secrets, Vault, or AWS SSM Parameter Store. See OWASP Secrets Management Cheat Sheet.
