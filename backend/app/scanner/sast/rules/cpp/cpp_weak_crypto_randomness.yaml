rule_id: cpp_weak_crypto_randomness
language: cpp
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via std::rand()
message: |-
  The application uses std::rand(), which is a cryptographically weak pseudo-random number generator (PRNG). If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- std::rand(
- rand(
sanitizers: []
remediation: |-
  Use cryptographically secure APIs provided by your OS (e.g., CryptGenRandom on Windows, /dev/urandom on Linux) or a vetted crypto library (like OpenSSL or libsodium) for security-sensitive randomness.

  UNSAFE:
    std::srand(std::time(nullptr));
    int token = std::rand();

  SAFE:
    // Use OS-level secure randomness or libsodium's randombytes_buf
