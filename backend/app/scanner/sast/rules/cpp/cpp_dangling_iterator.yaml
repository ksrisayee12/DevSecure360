rule_id: cpp_dangling_iterator
language: cpp
vuln_class: Use After Free
severity: High
cwe: CWE-416
owasp: A06:2021-Vulnerable and Outdated Components
cvss_score: 7.8
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: 'Use-After-Free via STL iterator invalidation: iterator used after container
  mutation'
message: |-
  An iterator to a standard library container (vector, deque, unordered_map) is stored and then used after an operation that invalidates it (push_back, erase, insert, rehash). The iterator points to freed or reallocated memory. Dereferencing it is undefined behavior, exploitable to read heap data or redirect control flow on hardened systems.
sources: []
sinks:
- push_back(
- .insert(
- .erase(
- .clear(
- .resize(
sanitizers:
- std::distance
- .end()
remediation: |-
  Re-acquire iterators after any mutating container operation. Use indices for stable references.

  UNSAFE:
    auto it = vec.begin();
    vec.push_back(42);  /* invalidates all iterators */
    *it = 0;            /* dangling iterator — UB */

  SAFE:
    size_t idx = std::distance(vec.begin(), it);  /* save index */
    vec.push_back(42);
    vec[idx] = 0;  /* use index, not iterator */

  Use iterator invalidation rules from the C++ standard. Consider span<> for stable views.
