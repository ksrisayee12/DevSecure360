remediation: |-
  Validate integer inputs before performing arithmetic operations. Consider using safe integer libraries or checking bounds against std::numeric_limits.

  UNSAFE:
    size_t total = count * size;
    char* buf = new char[total];

  SAFE:
    if (count > MAX_COUNT) throw std::overflow_error("Count too large");
