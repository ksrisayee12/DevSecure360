rule_id: cpp_cors_misconfig_crow
language: cpp
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: CORS Misconfiguration in Crow / C++ Web Framework
message: |-
  Adding a global HTTP header `Access-Control-Allow-Origin: *` permits arbitrary websites to make authenticated requests and read sensitive data.
sources: []
sinks:
- add_header("Access-Control-Allow-Origin", "*")
sanitizers:
- Origin allowlist
remediation: |-
  Configure CORS dynamically by checking the Origin header of the request against an allowlist before echoing it back. Always review your code and apply strict validation. Consult secure coding best practices.
