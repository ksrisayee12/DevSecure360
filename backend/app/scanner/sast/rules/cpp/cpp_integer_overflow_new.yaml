rule_id: cpp_integer_overflow_new
language: cpp
vuln_class: Integer Overflow
severity: High
cwe: CWE-190
owasp: A04:2021-Insecure Design
cvss_score: 7.8
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Integer Overflow leading to insufficient std::new allocation
message: |-
  Performing unchecked arithmetic inside a `new[]` array allocation can cause an integer overflow, resulting in a much smaller buffer than expected, leading to heap corruption.
sources: []
sinks:
- new char[size *
- new int[
sanitizers:
- std::numeric_limits
remediation: |-
  Validate arithmetic operations using std::numeric_limits to ensure they do not wrap around before allocating memory arrays. Always review your code and apply strict validation. Consult secure coding best practices.
