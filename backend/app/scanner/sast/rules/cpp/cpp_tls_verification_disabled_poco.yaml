rule_id: cpp_tls_verification_disabled_poco
language: cpp
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Improper TLS Certificate Validation in POCO C++
message: |-
  Initializing a POCO Context with Context::VERIFY_NONE disables TLS certificate validation, making connections vulnerable to interception (MitM).
sources: []
sinks:
- Context::VERIFY_NONE
sanitizers:
- Context::VERIFY_RELAXED
- Context::VERIFY_STRICT
remediation: |-
  Use Context::VERIFY_STRICT or VERIFY_RELAXED to ensure the server's certificate is properly validated against trusted root CAs. Always review your code and apply strict validation. Consult secure coding best practices.
