rule_id: cpp_out_of_bounds_array
language: cpp
vuln_class: Buffer Overflow
severity: High
cwe: CWE-119
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Out-of-Bounds Access on Raw Arrays
message: |-
  The application indexes into a C-style array using unvalidated user input, which can result in out-of-bounds reads or writes.
sources:
- std::cin
- std::getline
- getenv
- read
- recv
- ifstream
- istream
- stringstream
sinks:
- '['
sanitizers: []
remediation: |-
  Replace raw C-style arrays with std::array or std::vector and use the bounds-checked .at() method for element access.
