rule_id: cpp_uninitialized_memory_read
language: cpp
vuln_class: Memory Corruption
severity: Medium
cwe: CWE-457
owasp: A06:2021-Vulnerable and Outdated Components
cvss_score: 5.5
cvss_vector: CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: Memory Corruption via use of uninitialized local variable or stack memory
message: |-
  A local variable or struct field is declared but not initialized before being read or returned. Reading uninitialized stack memory exposes sensitive data from previous stack frames, including passwords, keys, and pointers. On Linux, partial ASLR bypass is possible by leaking stack pointer values through uninitialized struct members returned to user-space callers.
sources: []
sinks:
- 'int '
- 'char '
- 'struct '
sanitizers:
- = 0
- memset(
- = {}
remediation: |-
  Always initialize local variables and struct members at declaration. Use value-initialization.

  UNSAFE:
    int result;  /* uninitialized */
    if (condition) result = compute();
    return result;  /* may be garbage */

  SAFE:
    int result = 0;  /* initialized */
    if (condition) result = compute();
    return result;

  Build with -Wuninitialized -Wall. Use Valgrind/Memcheck. See CERT EXP33-C.
