# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/918.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=ssrf
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
# Verification:    User-controlled URLs passed to HTTP clients lead to SSRF, allowing internal network scanning.

rule_id: cpp_ssrf_curl
language: cpp
vuln_class: SSRF
severity: High
cwe: CWE-918
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: Server-Side Request Forgery (SSRF) via libcurl with unvalidated URLs
message: |-
  Passing an unvalidated user-provided URL to curl_easy_setopt(curl, CURLOPT_URL, url) allows an attacker to make the server perform unauthorized HTTP requests to internal services (SSRF).
sources: []
sinks:
- curl_easy_setopt(
- CURLOPT_URL
sanitizers:
- validate_url(
remediation: |-
  Validate user-supplied URLs against an allowlist of permitted domains/IPs. Block private network ranges (e.g., 10.0.0.0/8, 127.0.0.1, 169.254.169.254). Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
