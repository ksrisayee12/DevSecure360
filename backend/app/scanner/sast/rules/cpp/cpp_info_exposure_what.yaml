rule_id: cpp_info_exposure_what
language: cpp
vuln_class: Information Exposure
severity: Low
cwe: CWE-209
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Information Exposure via std::exception::what() in HTTP Responses
message: |-
  Returning the output of std::exception::what() directly to users in API or HTTP responses exposes internal database errors, file paths, or network configurations.
sources: []
sinks:
- what()
sanitizers:
- log_error
remediation: |-
  Catch exceptions and log `what()` securely on the backend, returning only a generic, safe error message to the client. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
