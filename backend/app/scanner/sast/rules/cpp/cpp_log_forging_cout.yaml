# Verification:    Unsanitized CRLF characters in logs allow spoofing log entries (Log Forging).

rule_id: cpp_log_forging_cout
language: cpp
vuln_class: Log Injection
severity: Medium
cwe: CWE-117
owasp: A09:2021-Security Logging and Monitoring Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection via std::cout / std::clog
message: |-
  Logging unvalidated user input using stream insertion operators can lead to log forging if the input contains carriage returns and newlines.
sources: []
sinks:
- std::cout <<
- std::clog <<
sanitizers:
- sanitize_crlf(
remediation: |-
  Sanitize log messages by stripping or encoding CRLF characters before writing them to standard output streams. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
