rule_id: cpp_insecure_random
language: cpp
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-330
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: 'Insecure Randomness: std::mt19937 used for security-sensitive operations'
message: |-
  The Mersenne Twister (std::mt19937) is a fast PRNG but is not cryptographically secure. Its internal state can be deduced after observing a sufficient number of outputs, making future values predictable.
sources: []
sinks:
- std::mt19937
- std::mt19937_64
sanitizers:
- std::random_device
remediation: |-
  Use std::random_device or an OS-level secure RNG (e.g., getrandom) for security purposes.

  UNSAFE:
    std::mt19937 rng(seed);

  SAFE:
    std::random_device rd;
    auto val = rd(); Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
