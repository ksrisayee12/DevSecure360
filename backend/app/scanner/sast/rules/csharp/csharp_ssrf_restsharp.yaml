# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/918.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=ssrf
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
# Verification:    Unvalidated user input passed to HTTP client libraries allows Server-Side Request Forgery.

rule_id: csharp_ssrf_restsharp
language: csharp
vuln_class: SSRF
severity: High
cwe: CWE-918
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: SSRF via RestSharp RestClient
message: |-
  Instantiating a RestClient or setting its BaseUrl using unvalidated user input enables SSRF, allowing attackers to access internal endpoints.
sources:
- Request.Query[
- Request.Form[
- Request.Headers[
- HttpContext.Request
sinks:
- new RestClient(
- client.Execute(
sanitizers:
- Uri.IsWellFormedUriString(
remediation: |-
  Ensure the URL provided to RestSharp is validated against an allowlist and does not point to internal network resources. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
