# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/209.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/csharp/semmle/code/csharp/security/dataflow/StackTraceExposure.qll
# Semgrep Source:  https://semgrep.dev/r/csharp.lang.security.exceptions.stack-trace-exposure
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
# Verification:    Writing ex.ToString() to an HTTP response clearly violates CWE-209 by exposing the stack trace.

rule_id: csharp_info_exposure
language: csharp
vuln_class: Information Exposure
severity: Low
cwe: CWE-209
owasp: A05:2021-Security Misconfiguration
cvss_score: 4.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Information Exposure through an Error Message (CWE-209)
message: |-
  The application writes raw exception details (stack traces) directly to the HTTP response. This exposes internal application structure and logic to attackers.
sources:
- Exception ex
- catch (Exception e)
sinks:
- Response.Write(
- ex.ToString()
- e.ToString()
- ex.StackTrace
- e.StackTrace
sanitizers: []
remediation: |-
  Do not expose exception details to users. Log the exception internally and return a generic error message.

  UNSAFE:
    catch (Exception ex) { Response.Write(ex.ToString()); }

  SAFE:
    catch (Exception ex) { log.Error(ex); Response.Write("An error occurred."); }
