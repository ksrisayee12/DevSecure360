# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/208.html
# CodeQL Source:   Not applicable — pattern-based comparison detection
# Semgrep Source:  https://semgrep.dev/r?q=timing+attack
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Non-constant-time comparison for cryptographic secrets detected structurally. Rule is Tentative.

rule_id: csharp_timing_attack
language: csharp
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-208
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: 'Timing attack: non-constant-time string comparison of HMAC or security token'
message: |-
  The application compares an HMAC result or security token using regular string == or String.Equals() comparison. C#'s string comparison short-circuits on the first differing character, leaking timing information via network measurements. An attacker making many requests can statistically determine valid HMAC bytes and forge authentication tokens.
sources:
- Request.Query[
- Request.Form[
- Request.Headers[
- HttpContext.Request
sinks:
- == providedToken
- String.Equals(
- .Equals(expectedMac
sanitizers:
- CryptographicOperations.FixedTimeEquals(
remediation: |-
  Use CryptographicOperations.FixedTimeEquals() for all HMAC and security-sensitive comparisons.

  UNSAFE:
    if (computedHmac == providedHmac) { /* timing leak */ }

  SAFE (.NET 5+):
    using System.Security.Cryptography;
    if (CryptographicOperations.FixedTimeEquals(
        computedHmac, providedHmac)) { /* constant-time */ }

  For older .NET: use a custom fixed-time compare with XOR across all bytes. See OWASP Cryptographic Storage Cheat Sheet.
