rule_id: csharp_weak_crypto_md5
language: csharp
vuln_class: Weak Crypto
severity: High
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: 'Weak Cryptography: Usage of MD5CryptoServiceProvider'
message: |-
  System.Security.Cryptography.MD5 or MD5CryptoServiceProvider implements the insecure MD5 hashing algorithm. It is vulnerable to collisions and not suitable for security operations.
sources: []
sinks:
- MD5.Create(
- new MD5CryptoServiceProvider(
sanitizers:
- SHA256.Create(
remediation: |-
  Replace MD5 with SHA256 (System.Security.Cryptography.SHA256.Create()) for data integrity, and use PBKDF2/Argon2 for passwords. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
