# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/916.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=pbkdf2+weak+iterations
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
# Verification:    NIST SP 800-132 recommends >=310,000 PBKDF2-SHA256 iterations as of 2023.

rule_id: csharp_weak_pbkdf2
language: csharp
vuln_class: Weak Crypto
severity: High
cwe: CWE-916
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Weak key derivation via Rfc2898DeriveBytes with iteration count below NIST
  SP 800-132 minimum
message: |-
  The application derives a password hash or encryption key using Rfc2898DeriveBytes (PBKDF2) with an iteration count below 310,000 (NIST SP 800-132 recommendation for PBKDF2-SHA256). Low iteration counts dramatically accelerate offline dictionary attacks. At 1,000 iterations, modern GPUs can test billions of passwords per second, cracking common passwords in seconds.
sources: []
sinks:
- new Rfc2898DeriveBytes(
- Rfc2898DeriveBytes(password
sanitizers:
- '310000'
- HashAlgorithmName.SHA512
remediation: |-
  Increase iterations to >= 310,000 for PBKDF2-SHA256, or switch to bcrypt/Argon2.

  UNSAFE:
    var pbkdf2 = new Rfc2898DeriveBytes(password, salt, 1000);  /* far too low */

  SAFE:
    var pbkdf2 = new Rfc2898DeriveBytes(
        password, salt, 310000, HashAlgorithmName.SHA256);

  BETTER (.NET 6+): Use Microsoft.AspNetCore.Identity which handles hashing with appropriate defaults. See NIST SP 800-132 and OWASP Password Storage Cheat Sheet.
