rule_id: csharp_missing_csp
language: csharp
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Content-Security-Policy header in ASP.NET Core responses
message: |-
  The ASP.NET Core application does not configure a Content-Security-Policy response header. Without CSP, any XSS vulnerability has no browser-level restriction on script execution or resource loading. A successful XSS attack can steal session cookies, exfiltrate sensitive data via authenticated API requests, or inject malicious content that persists for all users.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set a Content-Security-Policy header in ASP.NET Core via middleware.

  UNSAFE: No Content-Security-Policy header in the response pipeline.
  SAFE:
    app.Use(async (context, next) => {
        context.Response.Headers.Add(
            "Content-Security-Policy",
            "default-src 'self'; script-src 'self'");
        await next();
    });

  Consider the NWebSec NuGet package for a strongly-typed fluent security header configuration API.
