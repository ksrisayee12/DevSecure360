cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via XmlReader DTD Processing
message: |-
  Configuring an XmlReaderSettings with DtdProcessing.Parse and unbounded MaxCharactersFromEntities allows the Billion Laughs entity expansion attack.
sources: []
sinks:
- DtdProcessing.Parse
sanitizers:
- MaxCharactersFromEntities
remediation: |-
  Disable DTD processing (DtdProcessing.Prohibit) or strictly limit `MaxCharactersFromEntities` to prevent XML expansion attacks. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
