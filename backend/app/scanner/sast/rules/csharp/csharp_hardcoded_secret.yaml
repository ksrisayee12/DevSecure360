# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/798.html
# CodeQL Source:   Not applicable — pattern-based literal string detection
# Semgrep Source:  https://semgrep.dev/r?q=hardcoded+secret
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Hardcoded secret detection is pattern-based on string literal assignments. No HTTP taint source required.

rule_id: csharp_hardcoded_secret
language: csharp
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Hardcoded Secret or Cryptographic Key
message: |-
  The application source code contains hardcoded sensitive credentials such as passwords, API keys, or cryptographic keys, which can be easily extracted by attackers.
sources: []
sinks:
- password = "
- apiKey = "
- secret = "
- privateKey = "
sanitizers: []
remediation: |-
  Remove all hardcoded secrets from the codebase. Store sensitive credentials dynamically using secure mechanisms like Azure Key Vault, AWS Secrets Manager, or local environment variables.
