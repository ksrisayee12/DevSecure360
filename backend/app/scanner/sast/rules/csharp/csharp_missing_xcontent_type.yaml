rule_id: csharp_missing_xcontent_type
language: csharp
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing X-Content-Type-Options header in ASP.NET Core response enables MIME
  sniffing
message: |-
  The ASP.NET Core application does not set the X-Content-Type-Options: nosniff response header. Without this protection, browsers may MIME-sniff response content and execute it as a different type than declared. When combined with file upload functionality, this can allow attackers to upload malicious files that the browser executes as JavaScript despite a safe declared MIME type.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set X-Content-Type-Options in ASP.NET Core via middleware.

  UNSAFE: No X-Content-Type-Options header configured.
  SAFE:
    app.Use(async (context, next) => {
        context.Response.Headers.Add("X-Content-Type-Options", "nosniff");
        await next();
    });

  Apply this globally across all routes. Consider consolidating all security headers into one middleware class for maintainability and consistent coverage.
