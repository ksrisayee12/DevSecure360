rule_id: csharp_jwt_validation_bypass
language: csharp
vuln_class: JWT Bypass
severity: Critical
cwe: CWE-287
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: 'JWT Validation Bypass: ValidateIssuerSigningKey set to false'
message: |-
  Setting ValidateIssuerSigningKey to false in TokenValidationParameters disables cryptographic signature validation, allowing attackers to forge tokens.
sources: []
sinks:
- ValidateIssuerSigningKey = false
sanitizers:
- ValidateIssuerSigningKey = true
remediation: |-
  Always set ValidateIssuerSigningKey = true and provide a valid IssuerSigningKey in your TokenValidationParameters. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
