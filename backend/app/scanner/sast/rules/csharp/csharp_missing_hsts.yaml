confidence: Tentative
issue: Missing Strict-Transport-Security (HSTS) via UseHsts() in ASP.NET Core
message: |-
  The ASP.NET Core application does not call UseHsts() in its middleware pipeline, meaning the Strict-Transport-Security header is not sent to browsers. Without HSTS, browsers may connect over plain HTTP even when HTTPS is configured, leaving users vulnerable to man-in-the-middle attacks that can steal session tokens and credentials through SSL stripping.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Enable HSTS via UseHsts() and configure it with appropriate settings in ASP.NET Core.

  UNSAFE: No UseHsts() in the middleware pipeline.
  SAFE:
    if (!app.Environment.IsDevelopment())
    {
        app.UseHsts();
    }
    builder.Services.AddHsts(opts => {
        opts.MaxAge = TimeSpan.FromDays(365);
        opts.IncludeSubDomains = true;
    });

  Also call app.UseHttpsRedirection() to force all HTTP traffic to HTTPS before HSTS enforcement.
