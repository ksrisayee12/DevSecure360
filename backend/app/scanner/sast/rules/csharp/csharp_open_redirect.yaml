# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/601.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=open+redirect
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
# Verification:    Unvalidated user input used in HTTP redirect headers leads to Open Redirect/Phishing.

rule_id: csharp_open_redirect
language: csharp
vuln_class: Open Redirect
severity: Medium
cwe: CWE-601
owasp: A01:2021-Broken Access Control
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Open Redirect via Response.Redirect() or Redirect()
message: |-
  Redirecting users to unvalidated URLs provided via query parameters allows Open Redirect attacks. Attackers can conduct phishing by redirecting users from a trusted domain to a malicious one.
sources:
- Request.Query[
- Request.Form[
- Request.Headers[
- HttpContext.Request
sinks:
- Response.Redirect(
- return Redirect(
sanitizers:
- Url.IsLocalUrl(
remediation: |-
  Use Url.IsLocalUrl() to ensure the redirect destination is a relative path within the application, or validate against a hardcoded list of allowed domains. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
