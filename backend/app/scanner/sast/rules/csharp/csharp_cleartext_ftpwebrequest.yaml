rule_id: csharp_cleartext_ftpwebrequest
language: csharp
vuln_class: Cleartext Transmission
severity: High
cwe: CWE-319
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: Cleartext Transmission via FtpWebRequest
message: |-
  Using FtpWebRequest without setting EnableSsl to true transmits credentials and file data in plaintext, making it vulnerable to interception.
sources: []
sinks:
- FtpWebRequest.Create(
- EnableSsl = false
sanitizers:
- EnableSsl = true
remediation: |-
  Always set `EnableSsl = true` when using FtpWebRequest to ensure the FTP connection uses TLS. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
