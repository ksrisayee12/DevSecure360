# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/338.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/csharp/semmle/code/csharp/security/dataflow/InsecureRandomness.qll
# Semgrep Source:  https://semgrep.dev/r/csharp.lang.security.insecure-randomness
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    System.Random is explicitly documented by Microsoft as not cryptographically secure.

rule_id: csharp_weak_crypto_randomness
language: csharp
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via System.Random
message: |-
  The application uses System.Random, which is a cryptographically weak pseudo-random number generator (PRNG). If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- new Random(
- new System.Random(
sanitizers: []
remediation: |-
  Use System.Security.Cryptography.RandomNumberGenerator for generating cryptographically strong random numbers.

  UNSAFE:
    Random rnd = new Random();
    int token = rnd.Next();

  SAFE:
    using (RandomNumberGenerator rng = RandomNumberGenerator.Create()) {
        byte[] data = new byte[4];
        rng.GetBytes(data);
    }
