rule_id: csharp_tls_validation_bypass
language: csharp
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Validation: ServerCertificateCustomValidationCallback returns
  true'
message: |-
  Configuring HttpClientHandler's ServerCertificateCustomValidationCallback to always return true ignores certificate errors and enables MitM attacks.
sources: []
sinks:
- ServerCertificateCustomValidationCallback = (sender, cert, chain, sslPolicyErrors)
  => true
- ServerCertificateValidationCallback = delegate { return true; }
sanitizers:
- return sslPolicyErrors == SslPolicyErrors.None;
remediation: |-
  Remove custom validation callbacks that bypass security. Allow the framework to natively validate the certificate trust chain. Always review your code and apply strict validation. Consult secure coding best practices.
