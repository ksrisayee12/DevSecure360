rule_id: csharp_xpath_injection
language: csharp
vuln_class: XPath Injection
severity: High
cwe: CWE-643
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: XPath Injection
message: |-
  User input is used to construct an XPath query without sanitization. Attackers can modify the query logic to extract unauthorized data.
sources:
- Request.QueryString[
- Request.Form[
- Request.Cookies[
- Request.Headers[
- Request.Params[
- Request.Item[
- HttpContext.Request.Query[
- HttpContext.Request.Form[
- Environment.GetEnvironmentVariable(
- Environment.GetCommandLineArgs(
sinks:
- SelectSingleNode(
- SelectNodes(
- XPathNavigator.Select(
- XPathNavigator.Compile(
sanitizers: []
remediation: |-
  Sanitize user input before using it in XPath queries, or prefer parameterized querying if the library supports it.

  UNSAFE:
    root.SelectSingleNode("//user[name='" + userInput + "']");

  SAFE:
    // Validate userInput or use a safe XML search mechanism.
