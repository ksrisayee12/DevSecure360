# Verification:    User input in file paths without path sanitization allows arbitrary file read/write.

rule_id: csharp_path_traversal_file_read
language: csharp
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via File.ReadAllText() or FileStream
message: |-
  Using unvalidated user input to construct a path for File.ReadAllText() allows an attacker to use relative paths (../) to read sensitive configuration files (e.g., appsettings.json).
sources:
- Request.Query[
- Request.Form[
- Request.Headers[
- HttpContext.Request
sinks:
- File.ReadAllText(
- new FileStream(
sanitizers:
- Path.GetFileName(
remediation: |-
  Sanitize user input by extracting only the filename using Path.GetFileName() and ensure the resolved path resides inside the permitted directory. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
