rule_id: csharp_hardcoded_jwt_secret
language: csharp
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded JWT signing key — attackers with binary or source access can forge
  any JWT token
message: |-
  The JWT HMAC signing key is embedded as a string literal in C# source code. The entire security of JWT-based authentication depends on the key's secrecy. A hardcoded key exposed via source code leak, decompilation, or disassembly allows anyone to sign arbitrary JWT payloads as any user, including administrators, without needing credentials.
sources: []
sinks:
- new SymmetricSecurityKey(Encoding.UTF8.GetBytes("
- SecurityKey("
- signingKey = "secret
sanitizers:
- Configuration[
- Environment.GetEnvironmentVariable(
remediation: |-
  Load the JWT key from configuration or environment variables. Never embed it in source.

  UNSAFE:
    var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes("mySuperSecretKey!"));

  SAFE:
    var keyStr = configuration["JwtSettings:Secret"]  // from appsettings.json, secrets.json, or env
        ?? throw new InvalidOperationException("JWT secret not configured");
    var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(keyStr));

  Use .NET User Secrets in development and Azure Key Vault / AWS SSM in production. See OWASP Secrets Management Cheat Sheet.
