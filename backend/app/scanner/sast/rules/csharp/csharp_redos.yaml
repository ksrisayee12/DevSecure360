rule_id: csharp_redos
language: csharp
vuln_class: ReDoS
severity: Medium
cwe: CWE-1333
owasp: A03:2021-Injection
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
confidence: Tentative
issue: Regular Expression Denial of Service (ReDoS)
message: |-
  The application executes complex, backtracking regular expressions against untrusted user input without setting a timeout, allowing attackers to cause excessive CPU consumption.
sources:
- Request.QueryString[
- Request.Form[
- Request.Cookies[
- Request.Headers[
- Request.Params[
- Request.Item[
- HttpContext.Request.Query[
- HttpContext.Request.Form[
- Environment.GetEnvironmentVariable(
- Environment.GetCommandLineArgs(
sinks:
- Regex.Match(
- Regex.Matches(
- Regex.Replace(
- new Regex(
sanitizers:
- TimeSpan.FromSeconds
- TimeSpan.FromMilliseconds
- RegexOptions.NonBacktracking
remediation: |-
  Always specify a bounded matchTimeout (e.g., TimeSpan.FromSeconds(1)) when calling Regex methods. Alternatively, use RegexOptions.NonBacktracking in .NET 7+ to guarantee linear-time evaluation.
