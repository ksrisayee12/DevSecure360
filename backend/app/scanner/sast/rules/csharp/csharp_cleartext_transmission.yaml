# CWE Source:      https://cwe.mitre.org/data/definitions/319.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/csharp/semmle/code/csharp/security/CleartextTransmission.qll
# Semgrep Source:  https://semgrep.dev/r/csharp.lang.security.network.cleartext-transmission
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
# Verification:    Hardcoded HTTP URLs in HttpClient requests risk transmitting data in cleartext.

rule_id: csharp_cleartext_transmission
language: csharp
vuln_class: Cleartext Transmission
severity: High
cwe: CWE-319
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.4
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: Cleartext Transmission of Sensitive Information (CWE-319)
message: |-
  The application transmits data in cleartext using HTTP instead of secure protocols like HTTPS. This exposes sensitive data to man-in-the-middle (MITM) attacks and packet sniffing.
sources: []
sinks:
- HttpClient.GetAsync("http://
- HttpClient.PostAsync("http://
- WebRequest.Create("http://
sanitizers: []
remediation: |-
  Use secure transport protocols like HTTPS for all network communications.

  UNSAFE:
    await client.GetAsync("http://api.example.com");

  SAFE:
    await client.GetAsync("https://api.example.com");
