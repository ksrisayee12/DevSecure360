# Verification:    Type.GetType() followed by Activator.CreateInstance() on untrusted input allows instantiating malicious types.

rule_id: csharp_insecure_reflection
language: csharp
vuln_class: Code Injection
severity: High
cwe: CWE-470
owasp: A03:2021-Injection
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Insecure Reflection / Object Instantiation (CWE-470)
message: |-
  The application instantiates a class or invokes a method where the class name is controlled by user input. This can lead to arbitrary code execution.
sources:
- Request.QueryString[
- Request.Form[
- Request.Cookies[
- Request.Headers[
- Request.Params[
- Request.Item[
- HttpContext.Request.Query[
- HttpContext.Request.Form[
- Environment.GetEnvironmentVariable(
- Environment.GetCommandLineArgs(
sinks:
- Activator.CreateInstance(
- Type.GetType(
- Assembly.Load(
sanitizers: []
remediation: |-
  Never use user input directly as a class name for reflection. Use an explicit mapping or allowlist.

  UNSAFE:
    Type t = Type.GetType(userInput);
    Activator.CreateInstance(t);

  SAFE:
    // Validate input against a trusted allowlist before reflecting.
