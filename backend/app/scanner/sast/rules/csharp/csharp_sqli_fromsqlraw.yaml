rule_id: csharp_sqli_fromsqlraw
language: csharp
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via Entity Framework FromSqlRaw() with concatenated user input
message: |-
  User-controlled data is concatenated into a raw SQL string passed to Entity Framework's FromSqlRaw(), ExecuteSqlRaw(), or FromSql() methods. Unlike FromSqlInterpolated(), FromSqlRaw() does NOT parameterize the interpolated values. An attacker can inject arbitrary SQL to read unauthorized data, modify records, or execute database-level commands.
sources:
- Request.Query[
- Request.Form[
- Request.Headers[
- HttpContext.Request
sinks:
- FromSqlRaw(
- ExecuteSqlRaw(
- Database.ExecuteSqlRaw(
sanitizers:
- FromSqlInterpolated(
- ExecuteSqlInterpolated(
remediation: |-
  Use FromSqlInterpolated() which safely parameterizes values, or use LINQ query syntax.

  UNSAFE:
    var users = ctx.Users.FromSqlRaw("SELECT * FROM Users WHERE Name = '" + name + "'");

  SAFE (interpolated — automatically parameterized):
    var users = ctx.Users.FromSqlInterpolated($"SELECT * FROM Users WHERE Name = {name}");

  FromSqlInterpolated wraps FormattableString — the {name} becomes a parameter, not a literal. See EF Core documentation and OWASP SQL Injection Prevention Cheat Sheet.
