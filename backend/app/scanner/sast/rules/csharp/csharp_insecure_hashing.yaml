rule_id: csharp_insecure_hashing
language: csharp
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Insecure Hashing Algorithm (CWE-328)
message: |-
  The application uses a broken or weak cryptographic hashing algorithm such as MD5 or SHA1.
sources: []
sinks:
- MD5.Create()
- SHA1.Create()
- new MD5CryptoServiceProvider()
- new SHA1CryptoServiceProvider()
sanitizers: []
remediation: |-
  Use strong hashing algorithms like SHA256 or bcrypt.

  UNSAFE:
    var hash = MD5.Create();

  SAFE:
    var hash = SHA256.Create();
