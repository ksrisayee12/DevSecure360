# CWE Source:      https://cwe.mitre.org/data/definitions/330.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=insecure+randomness
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Non-cryptographic PRNGs used for security tokens are predictable.

rule_id: csharp_random_weak
language: csharp
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-330
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Insecure Randomness via System.Random used for security tokens
message: |-
  System.Random is not cryptographically secure. Using it to generate passwords, session IDs, or tokens allows attackers to predict future values.
sources: []
sinks:
- new Random(
sanitizers:
- RandomNumberGenerator.Create(
remediation: |-
  Use System.Security.Cryptography.RandomNumberGenerator for cryptographic randomness.

  SAFE:
    using (var rng = RandomNumberGenerator.Create()) {
        byte[] bytes = new byte[32];
        rng.GetBytes(bytes);
    } Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
