# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/117.html
# CodeQL Source:   Not applicable — pattern-based log sink detection
# Semgrep Source:  https://semgrep.dev/r?q=log+injection
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
# Verification:    Unsanitized CRLF characters in logs allow spoofing log entries (Log Forging).

rule_id: csharp_log_forging_serilog
language: csharp
vuln_class: Log Injection
severity: Medium
cwe: CWE-117
owasp: A09:2021-Security Logging and Monitoring Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection via unescaped string interpolation in loggers
message: |-
  Using C# string interpolation (`$`) to embed user input directly into unstructured log messages allows an attacker to inject newline characters and fake log entries.
sources:
- Request.Query[
- Request.Form[
- Request.Headers[
- HttpContext.Request
sinks:
- logger.LogInformation($
- Log.Warning($
sanitizers:
- logger.LogInformation("{Property}"
remediation: |-
  Use structured logging with message templates (e.g., `logger.LogInformation("User {User}", input)`) which properly encodes property values. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
