sinks:
- log.Info(
- log.Error(
- log.Warn(
- log.Debug(
- logger.LogInformation(
- logger.LogError(
sanitizers: []
remediation: |-
  Sanitize all user input by removing newline characters (CR and LF) before logging. Better yet, use structured logging (e.g., JSON logs) where input is treated as data, not raw text.
