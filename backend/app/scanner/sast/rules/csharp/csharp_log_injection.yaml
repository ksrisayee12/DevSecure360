cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
confidence: Confirmed
issue: Log Injection (Log Forging)
message: |-
  Unsanitized user input is written to log files, allowing attackers to inject newline characters and forge malicious log entries to cover tracks or mislead administrators.
