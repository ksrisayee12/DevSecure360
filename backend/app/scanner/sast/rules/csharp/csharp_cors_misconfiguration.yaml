rule_id: csharp_cors_misconfiguration
language: csharp
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.4
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Permissive Cross-Origin Resource Sharing (CORS)
message: |-
  The application configures CORS using AllowAnyOrigin(), which permits any external domain to make requests to the API and potentially access sensitive user data.
sources: []
sinks:
- AllowAnyOrigin()
sanitizers:
- WithOrigins(
remediation: |-
  Do not use AllowAnyOrigin(). Instead, explicitly whitelist trusted domains using the WithOrigins() method to ensure only authorized applications can interact with the API.
