# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/776.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/csharp/semmle/code/csharp/security/dataflow/XMLBomb.qll
# Semgrep Source:  https://semgrep.dev/r/csharp.lang.security.xml-bomb
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
# Verification:    DtdProcessing.Parse enables entity expansion, which requires MaxCharactersFromEntities to prevent DoS.

rule_id: csharp_xml_bomb
language: csharp
vuln_class: DoS
severity: High
cwe: CWE-776
owasp: A05:2021-Security Misconfiguration
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Tentative
issue: XML Entity Expansion / Billion Laughs (CWE-776)
message: |-
  The application enables DTD processing without setting a limit on MaxCharactersFromEntities, making it vulnerable to XML Bomb (Billion Laughs) DoS attacks.
sources: []
sinks:
- DtdProcessing = DtdProcessing.Parse
sanitizers:
- MaxCharactersFromEntities
remediation: |-
  If DtdProcessing must be set to Parse, explicitly configure MaxCharactersFromEntities to a safe limit.

  UNSAFE:
    var settings = new XmlReaderSettings { DtdProcessing = DtdProcessing.Parse };

  SAFE:
    var settings = new XmlReaderSettings { DtdProcessing = DtdProcessing.Prohibit };
