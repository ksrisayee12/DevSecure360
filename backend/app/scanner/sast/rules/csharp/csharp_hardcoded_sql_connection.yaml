rule_id: csharp_hardcoded_sql_connection
language: csharp
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded SQL Connection String
message: |-
  Hardcoding database connection strings containing User ID and Password in C# files exposes the database to compromise.
sources: []
sinks:
- '"User ID='
- '"Password='
- '"Pwd='
sanitizers:
- Configuration.GetConnectionString
remediation: |-
  Store connection strings in secure configuration files (e.g., appsettings.json) or Azure Key Vault, and access them via IConfiguration. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
