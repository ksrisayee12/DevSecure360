rule_id: go_missing_xframe_options
language: go
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing X-Frame-Options header in Go net/http handler allows clickjacking
message: |-
  The Go HTTP application does not set the X-Frame-Options response header, permitting any external site to embed the application in an iframe. Attackers can exploit this to perform clickjacking, overlaying an invisible iframe on top of a legitimate-looking page to trick authenticated users into triggering unintended state-changing operations.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set X-Frame-Options in a global Go HTTP middleware.

  UNSAFE: No X-Frame-Options header in HTTP response.
  SAFE:
    func secureHeaders(next http.Handler) http.Handler {
        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            w.Header().Set("X-Frame-Options", "DENY")
            next.ServeHTTP(w, r)
        })
    }

  Alternatively use Content-Security-Policy frame-ancestors directive which is the modern standard.
