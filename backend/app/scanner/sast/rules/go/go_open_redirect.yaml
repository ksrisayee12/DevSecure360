# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/601.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=open+redirect
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
# Verification:    Unvalidated user input used in HTTP redirect headers leads to Open Redirect/Phishing.

rule_id: go_open_redirect
language: go
vuln_class: Open Redirect
severity: Medium
cwe: CWE-601
owasp: A01:2021-Broken Access Control
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Open Redirect via http.Redirect()
message: |-
  Passing an unvalidated user-provided URL directly to http.Redirect() allows an attacker to redirect victims to malicious phishing sites, bypassing security filters.
sources:
- r.URL.Query()
- r.FormValue(
- r.Header.Get(
- r.Body
sinks:
- http.Redirect(
sanitizers:
- allowed_urls[
remediation: |-
  Validate the target URL against an allowlist, or strictly ensure it is a relative path (e.g., starts with '/' but not '//') before redirecting. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
