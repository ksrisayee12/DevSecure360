rule_id: go_dos_zip_bomb
language: go
vuln_class: DoS
severity: High
cwe: CWE-400
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
confidence: Confirmed
issue: Denial of Service via archive/zip or compress/gzip
message: |-
  Extracting archives or decompressing data using io.Copy without a size limit allows Zip Bomb attacks (decompression bombs) which exhaust server memory and disk space.
sources: []
sinks:
- gzip.NewReader(
- zip.OpenReader(
sanitizers:
- io.LimitReader(
remediation: |-
  Always wrap the decompression reader with `io.LimitReader` to enforce a maximum acceptable extracted file size. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
