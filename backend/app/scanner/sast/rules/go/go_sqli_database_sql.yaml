# Verification:    SQL injection sinks verified from CodeQL standard libraries and Semgrep registry for the respective language.

rule_id: go_sqli_database_sql
language: go
vuln_class: SQLi
severity: Critical
cwe: CWE-89
owasp: A03:2021-Injection
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: SQL Injection via string concatenation in database/sql
message: |-
  User-controlled data is concatenated directly into SQL queries using database/sql methods. An attacker can inject SQL syntax to bypass authentication or access unauthorized data.
sources:
- http.Request
- r.URL.Query().Get(
- r.FormValue(
- r.PostFormValue(
- r.Header.Get(
- r.Cookie(
- r.Body
- os.Getenv(
- os.Args[
sinks:
- db.Query(
- db.QueryRow(
- db.Exec(
- db.QueryContext(
- db.QueryRowContext(
- db.ExecContext(
- tx.Query(
- tx.QueryRow(
- tx.Exec(
sanitizers: []
remediation: |-
  Use parameterized queries with placeholders (?) instead of string concatenation. The database driver safely escapes the parameters.

  UNSAFE:
    db.Query("SELECT * FROM users WHERE name='" + name + "'")

  SAFE:
    db.Query("SELECT * FROM users WHERE name=?", name)
