# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/338.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/go/semmle/go/security/InsecureRandomness.qll
# Semgrep Source:  https://semgrep.dev/r/go.lang.security.audit.crypto.math_random.math-random-used
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    The math/rand package is explicitly documented by Go as not cryptographically secure.

rule_id: go_weak_crypto_randomness
language: go
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Insecure Randomness via math/rand
message: |-
  The application uses a cryptographically weak pseudo-random number generator (PRNG) from the math/rand package. If used in a security context like token generation, attackers can predict future random numbers.
sources: []
sinks:
- rand.Int(
- rand.Intn(
- rand.Float32(
- rand.Float64(
- rand.Read(
sanitizers: []
remediation: |-
  Use the crypto/rand package for generating cryptographically strong random numbers.

  UNSAFE:
    import "math/rand"
    token := rand.Int()

  SAFE:
    import "crypto/rand"
    import "math/big"
    token, _ := rand.Int(rand.Reader, big.NewInt(100))
