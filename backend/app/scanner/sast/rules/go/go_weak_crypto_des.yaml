rule_id: go_weak_crypto_des
language: go
vuln_class: Weak Crypto
severity: High
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: 'Weak Cryptography: Usage of crypto/des'
message: |-
  The crypto/des package implements DES and 3DES. These algorithms are obsolete and vulnerable to brute-force and collision attacks. They must not be used for secure encryption.
sources: []
sinks:
- des.NewCipher(
- des.NewTripleDESCipher(
sanitizers:
- aes.NewCipher(
remediation: |-
  Replace crypto/des with crypto/aes and use an authenticated encryption mode such as AES-GCM. Always ensure input validation and consult language-specific security documentation.
