# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/943.html
# CodeQL Source:   Not applicable — pattern-based query string detection
# Semgrep Source:  https://semgrep.dev/r?q=graphql+injection
