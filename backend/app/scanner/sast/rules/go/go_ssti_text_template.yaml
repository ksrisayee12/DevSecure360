# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/94.html
# CodeQL Source:   Not applicable — pattern-based
# Semgrep Source:  https://semgrep.dev/r?q=ssti
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
# Verification:    Passing user input directly as a template string leads to Template Injection (SSTI).

rule_id: go_ssti_text_template
language: go
vuln_class: Code Injection
severity: High
cwe: CWE-94
owasp: A03:2021-Injection
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Template Injection via text/template or html/template
message: |-
  Parsing user-controlled strings as template definitions (e.g., template.New().Parse(input)) allows Server-Side Template Injection, potentially leading to information disclosure or RCE.
sources:
- r.URL.Query()
- r.FormValue(
- r.Header.Get(
- r.Body
sinks:
- template.New(
- ).Parse(
sanitizers:
- template.ParseFiles(
remediation: |-
  Never parse user input directly as a template structure. Load static templates from files and pass user input strictly as template data parameters. Always ensure input validation and consult language-specific security documentation.
