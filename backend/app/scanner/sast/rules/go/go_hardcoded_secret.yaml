rule_id: go_hardcoded_secret
language: go
vuln_class: Hardcoded Secret
severity: High
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Hardcoded Secret or Credential
message: |-
  The application contains hardcoded secrets (API keys, passwords, tokens) in the source code. If the code is leaked, the secrets can be abused.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Remove hardcoded secrets from source code. Load credentials dynamically from environment variables or a secure configuration system.

  UNSAFE:
    apiKey := "sk-12345abcdef"

  SAFE:
    apiKey := os.Getenv("API_KEY")
