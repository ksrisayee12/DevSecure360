# Verification:    Missing Secure or HttpOnly flags on session cookies exposes them to XSS and MitM theft.

rule_id: go_cookie_insecure
language: go
vuln_class: Cookie Security
severity: Medium
cwe: CWE-614
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: 'Cookie Security: Missing Secure/HttpOnly in http.Cookie'
message: |-
  Creating an http.Cookie struct without setting Secure: true and HttpOnly: true exposes the session token to XSS and MitM attacks over unencrypted links.
sources: []
sinks:
- http.Cookie{
sanitizers:
- 'Secure: true'
- 'HttpOnly: true'
remediation: |-
  Ensure both `Secure: true` and `HttpOnly: true` are explicitly set when instantiating `http.Cookie`. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
