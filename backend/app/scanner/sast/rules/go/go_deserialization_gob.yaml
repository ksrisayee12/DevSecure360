rule_id: go_deserialization_gob
language: go
vuln_class: Deserialization
severity: High
cwe: CWE-502
owasp: A08:2021-Software and Data Integrity Failures
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
confidence: Tentative
issue: Insecure Deserialization via encoding/gob
message: |-
  Deserializing untrusted data with encoding/gob can be dangerous if the underlying types perform actions during initialization or method calls. While Go is generally safer than languages like Java or Python for deserialization, it can still lead to logic bugs or resource exhaustion.
sources:
- r.URL.Query()
- r.FormValue(
- r.Header.Get(
- r.Body
