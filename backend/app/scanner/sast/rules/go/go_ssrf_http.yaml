- client.Get(
- client.Do(
- client.Post(
sanitizers: []
remediation: |-
  Validate requested URLs against a strict allowlist. Do not allow users to specify arbitrary URLs for the application to fetch.

  UNSAFE:
    resp, err := http.Get(r.FormValue("url"))

