rule_id: go_gorilla_session_insecure
language: go
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-16
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Gorilla sessions configured without Secure or HttpOnly cookie attributes
message: |-
  The Go application uses gorilla/sessions without configuring the Secure and HttpOnly cookie options on the session store. A session cookie without the Secure flag can be sent over plain HTTP and intercepted. Without HttpOnly the session cookie is accessible to JavaScript code, making it vulnerable to theft via any XSS vulnerability in the application.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Configure gorilla/sessions with secure cookie options appropriate for production.

  UNSAFE:
    store := sessions.NewCookieStore([]byte(os.Getenv("KEY")))

  SAFE:
    store := sessions.NewCookieStore([]byte(os.Getenv("KEY")))
    store.Options = &sessions.Options{
        Path:     "/",
        MaxAge:   86400,
        HttpOnly: true,
        Secure:   true,
        SameSite: http.SameSiteStrictMode,
    }

  See OWASP Session Management Cheat Sheet for complete session cookie hardening guidance.
