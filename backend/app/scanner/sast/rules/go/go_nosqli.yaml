rule_id: go_nosqli
language: go
vuln_class: NoSQLi
severity: High
cwe: CWE-943
owasp: A03:2021-Injection
cvss_score: 8.2
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N
confidence: Confirmed
issue: NoSQL Injection via Unsanitized Input in MongoDB Queries
message: |-
  User input is directly interpolated into MongoDB query filters or BSON documents, allowing attackers to manipulate the logic of the query.
sources:
- http.Request
- r.URL.Query().Get(
- r.FormValue(
- r.PostFormValue(
