rule_id: go_cors_misconfiguration
language: go
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.4
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Permissive Cross-Origin Resource Sharing (CORS)
message: |-
  The application configures CORS to allow requests from any origin ('*'), which can expose sensitive authenticated data to malicious websites.
sources: []
sinks:
- 'AllowedOrigins: []string{"*"}'
- w.Header().Set("Access-Control-Allow-Origin", "*")
sanitizers: []
remediation: |-
  Configure CORS policies to explicitly allow only trusted and necessary domains. Avoid using wildcard origins ('*'), especially if the application relies on cookie-based authentication.
