rule_id: go_goroutine_leak
language: go
vuln_class: Memory Corruption
severity: Medium
cwe: CWE-400
owasp: A04:2021-Insecure Design
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
confidence: Tentative
issue: 'Resource Leak: Unbounded Goroutine Spawning'
message: |-
  Spawning goroutines inside a loop based on unvalidated user input without a concurrency limit (e.g., worker pool or semaphore) leads to memory exhaustion and DoS.
sources:
- r.URL.Query()
- r.FormValue(
- r.Header.Get(
- r.Body
sinks:
- go func()
sanitizers:
- sync.WaitGroup
- semaphore
remediation: |-
  Limit concurrency using a semaphore (buffered channel) or a worker pool to prevent unbounded goroutine creation. Always review your code and apply strict bounds or TLS configurations. Consult secure coding best practices.
