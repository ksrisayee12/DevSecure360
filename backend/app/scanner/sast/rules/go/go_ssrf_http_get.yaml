# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/918.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=ssrf
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
# Verification:    User-controlled URLs passed to HTTP clients lead to SSRF, allowing internal network scanning.

rule_id: go_ssrf_http_get
language: go
vuln_class: SSRF
severity: High
cwe: CWE-918
owasp: A01:2021-Broken Access Control
cvss_score: 8.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Confirmed
issue: Server-Side Request Forgery (SSRF) via http.Get() with unvalidated user input
message: |-
  Passing an unvalidated user-controlled URL to http.Get() or http.Post() enables SSRF. The attacker can abuse the server's network access to scan or attack internal infrastructure.
sources:
- r.URL.Query()
- r.FormValue(
- r.Header.Get(
- r.Body
sinks:
- http.Get(
- http.Post(
sanitizers:
- url.Parse(
remediation: |-
  Parse the URL and validate the hostname/IP against a strict allowlist. Ensure it does not resolve to internal network addresses before making the request. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
