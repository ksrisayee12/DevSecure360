# CWE Source:      https://cwe.mitre.org/data/definitions/79.html
# CodeQL Source:   https://codeql.github.com/codeql-standard-libraries/
# Semgrep Source:  https://semgrep.dev/r?q=xss
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
# Verification:    XSS sinks verified from CodeQL standard libraries and OWASP XSS Prevention Cheat Sheet.

rule_id: go_xss_template
language: go
vuln_class: XSS
severity: High
cwe: CWE-79
owasp: A03:2021-Injection
cvss_score: 6.1
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
confidence: Confirmed
issue: Cross-Site Scripting via text/template or Fprintf
message: |-
  User input is rendered using text/template or fmt.Fprintf directly to the HTTP response. Because text/template does not auto-escape HTML, an attacker can inject malicious scripts.
sources:
- http.Request
- r.URL.Query().Get(
- r.FormValue(
- r.PostFormValue(
- r.Header.Get(
- r.Cookie(
- r.Body
- os.Getenv(
- os.Args[
sinks:
- template.HTML(
- template.JS(
- template.URL(
- template.CSS(
- fmt.Fprintf(w,
sanitizers:
- html/template
- template.HTMLEscapeString(
- template.JSEscapeString(
remediation: |-
  Always use the html/template package instead of text/template for HTML output, as it provides contextual auto-escaping.

  UNSAFE:
    fmt.Fprintf(w, "<h1>Hello %s</h1>", r.FormValue("name"))

  SAFE:
    t, _ := template.New("foo").Parse("<h1>Hello {{.Name}}</h1>")
    t.Execute(w, data)
