rule_id: go_tls_insecure_skip_verify
language: go
vuln_class: Misconfiguration
severity: High
cwe: CWE-295
owasp: A02:2021-Cryptographic Failures
cvss_score: 8.1
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
confidence: Tentative
issue: 'Improper TLS Certificate Validation: InsecureSkipVerify: true'
message: |-
  Setting InsecureSkipVerify to true in Go's crypto/tls Config disables TLS certificate checking, allowing attackers to perform Man-in-the-Middle (MitM) attacks.
sources: []
sinks:
- 'InsecureSkipVerify: true'
- InsecureSkipVerify:true
sanitizers:
- 'InsecureSkipVerify: false'
remediation: |-
  Remove InsecureSkipVerify: true from production code. Let the default Go behavior validate TLS certificates securely. Always review your code and apply strict validation. Consult secure coding best practices.
