rule_id: go_jwt_hardcoded_secret
language: go
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded JWT HMAC signing secret — anyone with binary access can forge any
  JWT token
message: |-
  The JWT signing secret is hardcoded as a string literal in Go source code. HMAC-signed JWTs derive their security entirely from the secrecy of the signing key. Anyone who obtains the key (via source leak, binary inspection, or memory dump) can forge tokens for any user identity, including admin accounts, without any credential.
sources: []
sinks:
- '[]byte("secret","[]byte("password","jwt.NewWithClaims(jwt.SigningMethodHS'
- signingKey = "
sanitizers:
- os.Getenv(
- secretsManager
remediation: |-
  Load the JWT signing key from an environment variable or secrets manager at runtime.

  UNSAFE:
    signingKey := []byte("mySuperSecretKey123!")
    token.SignedString(signingKey)

  SAFE:
    key := os.Getenv("JWT_SECRET")
    if len(key) < 32 { log.Fatal("JWT_SECRET must be at least 32 bytes") }
    token.SignedString([]byte(key))

  Generate the key with: openssl rand -base64 64. Rotate periodically. See OWASP JSON Web Token Cheat Sheet.
