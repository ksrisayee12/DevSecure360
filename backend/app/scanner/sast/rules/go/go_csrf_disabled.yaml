rule_id: go_csrf_disabled
language: go
vuln_class: Misconfiguration
severity: High
cwe: CWE-352
owasp: A01:2021-Broken Access Control
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:N
confidence: Tentative
issue: CSRF Protection Disabled or Missing in Go web framework
message: |-
  Failing to implement CSRF protection (e.g., anti-CSRF tokens, SameSite cookies) allows attackers to forge requests on behalf of authenticated users via malicious sites.
sources: []
sinks:
- http.ListenAndServe(
sanitizers:
- csrf.Protect(
