# Verification:    Using wildcard (*) for CORS Access-Control-Allow-Origin exposes APIs to cross-origin attacks. Tentative.

rule_id: go_cors_wildcard
language: go
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-942
owasp: A05:2021-Security Misconfiguration
cvss_score: 6.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Tentative
issue: 'CORS Misconfiguration: Access-Control-Allow-Origin wildcard'
message: |-
  Writing a hardcoded '*' to the Access-Control-Allow-Origin HTTP header in Go disables Same-Origin protections for the endpoint.
sources: []
sinks:
- w.Header().Set("Access-Control-Allow-Origin", "*")
sanitizers:
- allowed_origins slice
remediation: |-
  Check the request's Origin header against a slice of allowed domains and set the response header dynamically to match the valid Origin. Always review your code and apply strict validation. Consult secure coding best practices.
