rule_id: go_race_condition
language: go
vuln_class: Race Condition
severity: Medium
cwe: CWE-362
owasp: A04:2021-Insecure Design
cvss_score: 5.9
cvss_vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:L
confidence: Tentative
issue: Data Race Condition in Concurrent Execution
message: |-
  The application shares state across multiple goroutines without proper synchronization mechanisms (like mutexes or channels), leading to unpredictable behavior or data corruption.
sources: []
sinks:
- go func()
- sync.WaitGroup
sanitizers:
- sync.Mutex
- sync.RWMutex
- atomic.
remediation: |-
  Ensure all shared variables accessed by multiple goroutines are protected using synchronization primitives such as sync.Mutex, channels, or the sync/atomic package to prevent data races.
