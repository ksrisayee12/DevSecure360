rule_id: go_missing_csp
language: go
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing Content-Security-Policy header in Go net/http handler
message: |-
  The Go HTTP application does not set a Content-Security-Policy response header. Without CSP, any XSS vulnerability present in the application has no browser-level restriction on what scripts can execute or what resources can be loaded. A successful XSS attack allows the attacker to steal session tokens, perform authenticated API calls, and exfiltrate sensitive data.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set the Content-Security-Policy header in a global Go HTTP middleware.

  UNSAFE: No Content-Security-Policy header in handler or middleware.
  SAFE:
    w.Header().Set("Content-Security-Policy", "default-src 'self'")

  For Gin framework:
    c.Header("Content-Security-Policy", "default-src 'self'")

  Validate the policy with Google CSP Evaluator before deploying to production.
