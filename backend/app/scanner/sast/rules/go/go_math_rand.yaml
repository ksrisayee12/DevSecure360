rule_id: go_math_rand
language: go
vuln_class: Weak Crypto
severity: Medium
cwe: CWE-330
owasp: A02:2021-Cryptographic Failures
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
confidence: Tentative
issue: Insecure Randomness via math/rand for security tokens
message: |-
  The math/rand package implements a pseudo-random number generator that is not cryptographically secure. Using it for passwords, tokens, or session IDs makes them predictable.
sources: []
sinks:
- rand.Int(
- rand.Float64(
sanitizers:
- crypto/rand
remediation: |-
  Use crypto/rand for all security-sensitive random number generation.

  UNSAFE:
    token := rand.Int63()

  SAFE:
    import "crypto/rand"
    b := make([]byte, 16)
    rand.Read(b) Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
