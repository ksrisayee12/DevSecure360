# Verification:    User input in file paths without path sanitization allows arbitrary file read/write.

rule_id: go_path_traversal_os_open
language: go
vuln_class: Path Traversal
severity: High
cwe: CWE-22
owasp: A01:2021-Broken Access Control
cvss_score: 7.5
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
confidence: Confirmed
issue: Path Traversal via os.Open() or os.ReadFile()
message: |-
  Opening files based on user input without validation allows directory traversal. Attackers can read sensitive files outside the intended directory.
sources:
- r.URL.Query()
- r.FormValue(
- r.Header.Get(
- r.Body
sinks:
- os.Open(
- os.ReadFile(
- ioutil.ReadFile(
sanitizers:
- filepath.Clean(
- filepath.Base(
remediation: |-
  Use filepath.Base() to extract only the filename, and check if the resolved path starts with the expected base directory using strings.HasPrefix. Always review your code and apply strict bounds or input limitations. Use static analysis tools to verify fixes.
