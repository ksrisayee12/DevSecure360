rule_id: go_missing_xcontent_type
language: go
vuln_class: Misconfiguration
severity: Medium
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
confidence: Tentative
issue: Missing X-Content-Type-Options header in Go net/http handler
message: |-
  The Go HTTP application does not set the X-Content-Type-Options: nosniff response header. Without this, browsers may override the declared MIME type and execute responses as a different content type. This significantly increases the risk of file upload vulnerabilities, as a browser might execute a malicious file served as text/plain as JavaScript code.
sources: []
sinks: []
sanitizers: []
remediation: |-
  Set X-Content-Type-Options in all Go HTTP responses via a global middleware.

  UNSAFE: No X-Content-Type-Options header.
  SAFE:
    w.Header().Set("X-Content-Type-Options", "nosniff")

  Apply this in the outermost middleware so it applies to all routes including static file serving. The unrolled/secure package applies this automatically alongside other security headers.
