rule_id: go_redos
language: go
vuln_class: ReDoS
severity: Medium
cwe: CWE-1333
owasp: A03:2021-Injection
cvss_score: 5.3
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
confidence: Tentative
issue: Regular Expression Denial of Service via Third-Party Engine
message: |-
  The application uses a backtracking regular expression engine (like regexp2) on untrusted input, which can lead to catastrophic backtracking and Denial of Service (ReDoS).
sources:
- http.Request
- r.URL.Query().Get(
- r.FormValue(
- r.PostFormValue(
- r.Header.Get(
- r.Cookie(
- r.Body
- os.Getenv(
- os.Args[
sinks:
- regexp2.Compile(
- regexp2.MustCompile(
sanitizers: []
remediation: |-
  Avoid using backtracking regex engines like regexp2 for untrusted input. Prefer the standard library's regexp package, which uses RE2 and guarantees linear time execution, preventing ReDoS attacks.
