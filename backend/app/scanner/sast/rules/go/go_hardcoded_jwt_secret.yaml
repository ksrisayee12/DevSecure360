# RESEARCH EVIDENCE
# CWE Source:      https://cwe.mitre.org/data/definitions/798.html
# CodeQL Source:   Not applicable — pattern-based literal string detection
# Semgrep Source:  https://semgrep.dev/r?q=hardcoded+secret
# OWASP Cheat:     https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
# Verification:    Hardcoding passwords or database credentials in source code enables complete compromise upon source leak.

rule_id: go_hardcoded_jwt_secret
language: go
vuln_class: Hardcoded Secret
severity: Critical
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: 9.8
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
confidence: Confirmed
issue: Hardcoded JWT Signing Secret
message: |-
  Hardcoding the secret key used to sign JSON Web Tokens allows attackers who access the source to forge valid tokens and impersonate any user.
sources: []
sinks:
- '[]byte("secret")'
- '[]byte("supersecret")'
sanitizers:
- os.Getenv(
remediation: |-
  Read the JWT secret key from environment variables or a key management system. Always review your code and apply strict validation and sanitization. Consult secure coding best practices.
